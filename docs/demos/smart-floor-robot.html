<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Smart round robot floor cleaner guide</title>
<meta name="description" content="A round robot, 165 mm across, on a bought Romi chassis. It cleans a hard floor with a microfibre pad in straight lanes. It keeps a map of the clean area and comes back to its start point. A phone app shows the map and controls the robot.">
<meta name="generator" content="jig 1.2.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
/* jig guide page. Light tokens on :root; dark under prefers-color-scheme and [data-theme="dark"]. Text pairs >= 4.5:1, --control >= 3:1. */
:root{--page:#f3f0e8;--card:#fbfaf6;--ink:#1d1b18;--text:#2f2c27;--muted:#67625a;--line:#d8d2c5;--control:#8a8275;--faint:#ebe6db;--accent:#b04510;--accent-ink:#ffffff;--warn:#a3261b;--warn-bg:#fbe8e4;--caution:#7d5300;--caution-bg:#fbf0d6;--ok:#2f7a3d;--wood-ink:#1d1b18;
--v-ink:#3b352d;--v-accent:#ec6a1c;--v-grid:#d3cbbc;--v-prop:1;--display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#131210;--card:#1b1a17;--ink:#f4f0e8;--text:#d9d4ca;--muted:#9d978d;--line:#35322c;--control:#716b61;--faint:#24221e;--accent:#ff8a4c;--accent-ink:#1b1a17;--warn:#ff9a8b;--warn-bg:#3a1713;--caution:#f3c46a;--caution-bg:#33270e;--ok:#7fd18b;--v-ink:#2a2620;--v-accent:#ff7a2e;--v-grid:#3a3731;--v-prop:.42;color-scheme:dark}}
:root[data-theme="dark"]{--page:#131210;--card:#1b1a17;--ink:#f4f0e8;--text:#d9d4ca;--muted:#9d978d;--line:#35322c;--control:#716b61;--faint:#24221e;--accent:#ff8a4c;--accent-ink:#1b1a17;--warn:#ff9a8b;--warn-bg:#3a1713;--caution:#f3c46a;--caution-bg:#33270e;--ok:#7fd18b;--v-ink:#2a2620;--v-accent:#ff7a2e;--v-grid:#3a3731;--v-prop:.42;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--page)}
/* the sticky tab bar covers the top 64px: focus and scrollIntoView keep what they show below it (WCAG 2.4.11); no bar with one tab */
html{scroll-padding-top:64px}
html:has(.jig[data-single]){scroll-padding-top:0}
body{margin:0;color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.jig{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);color:var(--ink);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
h1{font-size:clamp(30px,5.6vw,46px);line-height:1.04;font-weight:700}
h2{font-size:24px;line-height:1.15}
h3{font-size:16px}
h2[tabindex]{scroll-margin-top:8px}
h2[tabindex]:focus{outline:none}
h2[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;max-width:62ch;margin:10px 0 0}
.lede.sm{font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--text);background:var(--card);border:1px solid var(--control);padding:9px 12px;border-radius:7px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--ink);color:var(--ink)}
button:disabled,button[aria-disabled="true"]{opacity:.55;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{accent-color:var(--ok)}

/* top bar and tabs */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 24px;margin-bottom:18px}
.level{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.level .eyebrow{margin-right:6px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:10px 4px;margin:0 -4px 18px;background:var(--page);border-bottom:1px solid var(--line)}
.tabs [role="tab"]{border-radius:999px;white-space:nowrap}
.tabs [role="tab"][aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
[data-panel][hidden]{display:none}
[role="tabpanel"]:focus-visible{outline-offset:6px;border-radius:6px}

/* cards and grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.stats div{background:var(--card);padding:12px 14px;min-width:0}
.stats b{display:block;font:700 22px/1.1 var(--display);color:var(--ink);overflow-wrap:anywhere}
.stats span{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:18px;min-width:0}

/* viewer: pan-y lets a finger scroll the page; a tap on the view turns on one-finger orbit */
.viewer{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,var(--card),var(--faint));aspect-ratio:16/11;min-height:280px;touch-action:pan-y}
.viewer [data-canvas]{position:absolute;inset:0}
.viewer canvas{width:100%!important;height:100%!important;display:block;touch-action:pan-y}
.viewer[data-active] canvas{touch-action:none}
.viewer canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.viewer [data-tags]{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--card);border:1.5px solid var(--accent);color:var(--ink);font:700 12px/19px var(--mono);text-align:center;box-shadow:0 1px 3px #0003}
.pin{position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--card) 70%,transparent)}
/* from 360 px wide the buttons stay on one row (on a narrower screen they can go on two rows): a readout that does not
   fit beside them goes above them (wrap-reverse) on one line, and only a readout wider than the whole bar ends in "…"
   (app.js puts the full text in its title). A phone (520 px or less) has no readout. */
.vbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:end;gap:4px 8px;pointer-events:none}
.vbar>*{pointer-events:auto}
.vtools{display:flex;gap:4px;flex-wrap:wrap}
.viewer:not([data-ready]) .vtools{visibility:hidden}
.vtools button{padding:7px 9px;font-size:11px;background:color-mix(in srgb,var(--card) 92%,transparent)}
.vtools button[aria-pressed="true"]{background:var(--ink)}
.readout{font:500 11px/1.3 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--card) 90%,transparent);padding:6px 8px;border-radius:6px;text-align:right;margin-left:auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;left:10px;top:10px;margin:0;max-width:calc(100% - 20px);padding:4px 7px;border-radius:6px;background:color-mix(in srgb,var(--card) 90%,transparent);font:500 11px/1.3 var(--mono);color:var(--muted);pointer-events:none}
.hint .h-touch,.hint .h-on{display:none}
@media (pointer:coarse){.hint .h-mouse{display:none}.hint .h-touch{display:inline}.viewer[data-active] .hint .h-touch{display:none}.viewer[data-active] .hint .h-on{display:inline}}
.viewer[data-user]:not([data-active]) .hint{opacity:0}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;font:500 13px/1.5 var(--mono);color:var(--muted)}
.fig{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font:500 11px/1.3 var(--mono);color:var(--muted);margin:8px 2px 0}
/* a long word in the title breaks inside the word in the Fig 1 caption too, so the Plan tab fits a 320 px screen */
.fig span{min-width:0;overflow-wrap:anywhere}
/* the Plan view tour line, then the Try it sliders: one for each motion of the finished object */
.tourline{margin:8px 2px 0;min-height:2.9em;font:500 12px/1.45 var(--mono);color:var(--text);overflow-wrap:anywhere}
.try{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.try h3{margin:0 0 6px;font-size:14px}
.motion{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) 5.5em;align-items:center;gap:10px;padding:4px 0}
.motion label{font-size:13px;overflow-wrap:anywhere}
.motion input{width:100%;min-width:0;accent-color:var(--accent)}
.motion output{font:500 12px/1.3 var(--mono);color:var(--muted);text-align:right}
/* a step's view note sits under the 3D view; with no picture (still loading, or no 3D) it has nothing to tell */
.vnote{margin:8px 2px 0;font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.viewer:not([data-ready])+.vnote{display:none}

/* plan */
.phases{display:flex;flex-wrap:wrap;gap:12px 6px;margin:14px 0 6px}
.phase{min-width:min(5.5rem,100%)}
.phase .bar{height:10px;border-radius:5px;background:var(--faint);border:1px solid var(--line)}
.phase:nth-child(3n+2) .bar{background:color-mix(in srgb,var(--accent) 35%,var(--faint))}
.phase:nth-child(3n+3) .bar{background:color-mix(in srgb,var(--accent) 70%,var(--faint))}
.phase .nm{font:600 13px/1.3 var(--display);color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.phase .tm{font:400 11px/1.3 var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips button{padding:5px 6px;font-size:11px;min-height:28px;min-width:28px}
ul.plain{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
ul.plain li{display:flex;gap:8px;align-items:baseline;min-width:0}
ul.plain li>span:last-child{min-width:0;overflow-wrap:anywhere}
ul.plain li>.pill{flex:0 0 auto}

/* pills and badges */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11px/1.25 var(--mono);padding:5px 7px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--card);max-width:100%;overflow-wrap:anywhere}
.pill.ppe{border-color:var(--caution);color:var(--caution)}
.pill.part{border-color:var(--accent);color:var(--ink)}
.pill.part b{color:var(--accent)}
.est{font:500 11px/1 var(--mono);padding:2px 4px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}

/* build */
.build{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.build .stage{position:sticky;top:64px}
.jig[data-single] .build .stage{top:16px}
.rail{display:flex;gap:4px;overflow-x:auto;padding:4px 4px 10px;margin:-2px -4px 12px}
.rail button{min-width:38px;padding:8px 0;position:relative;flex:0 0 auto}
.rail button[data-done]::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:3px;background:var(--ok)}
.rail button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rail .sep{flex:0 0 1px;background:var(--line);margin:4px 3px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.alert{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;border-left:4px solid;color:var(--ink)}
.alert b{display:block;font:700 11px/1.4 var(--mono);letter-spacing:.1em}
.alert.warning{background:var(--warn-bg);border-color:var(--warn)}
.alert.warning b{color:var(--warn)}
.alert.caution{background:var(--caution-bg);border-color:var(--caution)}
.alert.caution b{color:var(--caution)}
ol.do{margin:14px 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:8px}
ol.do li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:15.5px;color:var(--ink)}
ol.do li::before{content:counter(n);font:700 12px/22px var(--mono);text-align:center;height:22px;border-radius:11px;background:var(--faint);color:var(--text)}
ol.do li.new{color:var(--text);counter-increment:none}
ol.do li.new::before{content:"+";background:none;border:1px dashed var(--control)}
details.tech{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--page)}
details.tech summary{cursor:pointer;padding:9px 12px;font:600 13px/1.3 var(--display);color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary::after{content:"How to";font:500 11px/1.5 var(--mono);color:var(--muted);text-transform:uppercase;white-space:nowrap}
details.tech[open] summary::after{content:"Close"}
details.tech summary .see{font:500 11px/1.5 var(--mono);color:var(--muted);margin-left:auto}
details.tech .in{padding:0 12px 10px}
details.tech ol{margin:4px 0;padding-left:20px;font-size:14px}
details.tech .tl{font-size:13px;color:var(--muted);margin:6px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;margin:14px 0 10px;background:var(--page)}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.why,.tip{font-size:14px;color:var(--text);margin:8px 0 0;padding-left:12px;border-left:2px solid var(--line)}
/* the step heading keeps its focus ring (2px + 2px offset) clear of the "Step n of N" line above it */
article.step .eyebrow+h2{margin-top:6px}
/* a long word in a step (an instruction, the check, a note, a card) breaks inside the word, so the card never runs past
   a 320 px screen; .check is a flex row, so its text also needs min-width 0 */
ol.do li,.check span,article.step .eyebrow,.why,.tip,.alert,details.tech{overflow-wrap:anywhere}
.check span{min-width:0}
.why b,.tip b{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px}
.empty{color:var(--muted);font-size:14px}

/* levels: First time sees all; Some experience hides first-time lines and "why"; Experienced also hides tips */
[data-level="some"] .only-new,[data-level="pro"] .only-new,[data-level="pro"] .not-pro{display:none}

/* shop */
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.trip h3{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.trip .note{font-size:13px;color:var(--muted);margin:4px 0 8px;overflow-wrap:anywhere}
.trip label{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--faint);font-size:14px;align-items:start}
.trip label small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.trip input{margin-top:3px}
.trip label:has(input:checked) .it{text-decoration:line-through;color:var(--muted)}
.trip .n{text-align:right;font:500 12px/1.4 var(--mono);white-space:nowrap}
.trip .n .pill{margin-top:3px}
.trip .sum{display:flex;justify-content:space-between;font:600 13px/1 var(--mono);padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--faint);vertical-align:top}
th{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
td small{color:var(--muted)}
tr.grp td{font:600 12px/1.3 var(--display);color:var(--ink);background:var(--page);padding-top:12px}
tfoot td{font-weight:600;color:var(--ink);border-bottom:0}
tfoot tr.total td{font-size:16px;border-top:2px solid var(--ink)}
tfoot td.inc{white-space:normal}
code.c{font:500 11px/1 var(--mono);color:var(--muted)}
.notes{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--text)}
.notes li{margin:4px 0}

/* cut list: wood fill is a light tint of the material colour, so the dark label always reads */
.cutplan h3{margin:18px 0 6px}
.board{margin:10px 0 16px}
.board .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font:500 12px/1.3 var(--mono);color:var(--muted);margin-bottom:4px}
.board svg{width:100%;height:auto;display:block}
.board .bar{position:relative;height:46px;border:1px dashed var(--muted);border-radius:3px;background:repeating-linear-gradient(45deg,var(--faint) 0 4px,var(--line) 4px 5.5px)}
.board .seg{position:absolute;top:3px;bottom:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border:1px solid #5c4a30;border-radius:2px;color:var(--wood-ink);font:700 13px/1.15 var(--mono)}
.board .seg small{font-weight:500;font-size:11px}
.board svg .wood{stroke:#5c4a30;stroke-width:1}
.board svg .waste{fill:url(#jig-hatch);stroke:var(--line)}
.board svg text{font:700 26px var(--mono);fill:var(--wood-ink)}
.board svg text.dim{font-weight:500;font-size:19px}
.board svg.sheet{max-width:440px}.board svg.sheet text{font-size:52px}.board svg.sheet text.dim{font-size:38px}
.board svg .stock{fill:none;stroke:var(--muted);stroke-dasharray:4 3}
.board .note{margin:6px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.defs{position:absolute;width:0;height:0}
/* print list: the settings cell wraps, a long word too */
.prints td.set{min-width:12ch;overflow-wrap:anywhere}

/* noscript copy */
.jig:empty{display:none}
.noscript{max-width:820px;margin:0 auto;padding:28px 16px}

/* print: every step once, in order, no 3D, light colours */
.print-only{display:none}
@media print{
:root:root:root{--page:#fff;--card:#fff;--ink:#000;--text:#1d1b18;--muted:#4a463f;--line:#999;--control:#777;--faint:#eee;--accent:#8f3609;--accent-ink:#fff;--warn:#8a1d13;--warn-bg:#fff;--caution:#5c3d00;--caution-bg:#fff;--ok:#1f5a2a;color-scheme:light}
.tabs,.top .level,.viewer,.vbar,.fig,.vnote,.tourline,.try,.rail,.build,.nav,.chips,[data-live]{display:none!important}
[data-panel]{display:block!important;margin-bottom:24px}
.print-only{display:block}
.grid2{display:block}
.card{break-inside:avoid;margin:12px 0}
.jig{padding:0}
details.tech summary::after,details.tech[open] summary::after{content:none}
/* fitBoq() measures the screen, not the paper: in print an item with a word of 20 letters or more may break in it */
.boq td[data-long]{overflow-wrap:anywhere}
}
.pm{display:none}
/* a long word in the summary or a trip item breaks rather than run under the amount or past the screen (the BOQ item
   too, on narrow screens, where its row is a grid; in a table it would shrink the column and break short words, so
   there app.js fitBoq() sets data-break only on the item cells that make the table scroll sideways) */
.lede,.trip label .it{overflow-wrap:anywhere}
.boq td[data-break]{overflow-wrap:anywhere}
/* the BOQ table: app.js fitBoq() sets data-fit only when the table would scroll sideways with no short word broken:
   "wrap" (Buy and Rate wrap at a space), then "stack" (each row is a grid, as on a phone) */
.boq[data-fit~="wrap"] tbody td:nth-child(4),.boq[data-fit~="wrap"] tbody td:nth-child(5){white-space:normal}
.boq[data-fit~="stack"] thead{display:none}
.boq[data-fit~="stack"],.boq[data-fit~="stack"] tbody,.boq[data-fit~="stack"] tfoot{display:block}
.boq[data-fit~="stack"] tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--faint)}
.boq[data-fit~="stack"] td{border:0;padding:0}
.boq[data-fit~="stack"] tbody td:nth-child(1){grid-row:1/4}
.boq[data-fit~="stack"] tbody td:nth-child(2){grid-column:2;grid-row:1;overflow-wrap:anywhere}
.boq[data-fit~="stack"] tbody td:nth-child(3){grid-column:2;grid-row:2}

<noscript><div class="noscript"><h1>Smart round robot floor cleaner</h1>
<p>A round robot, 165 mm across, on a bought Romi chassis. It cleans a hard floor with a microfibre pad in straight lanes. It keeps a map of the clean area and comes back to its start point. A phone app shows the map and controls the robot.</p>
<p>Size: 165 × 78 × 165 mm (width × height × depth). Time: 9 h 10 min of work and 11 h 40 min of waiting. Cost: $341.54, an estimate.</p>
<p>Level: First time.</p>
<p>Turn on JavaScript to see the 3D view, the level switch and the tick boxes.</p>
<h2>Plan</h2>
<ol><li>Prepare: steps 1, 40 min + 11 h 40 min wait</li><li>Chassis: steps 2, 3, 4, 5, 2 h 40 min</li><li>Electronics: steps 6, 7, 8, 9, 2 h 15 min</li><li>Wiring: steps 10, 11, 1 h 30 min</li><li>Program and test: steps 12, 13, 1 h 30 min</li><li>Finish: steps 14, 15, 40 min</li></ol>
<h3>Tools</h3>
<ul><li>Computer with a USB port (you have it)</li><li>Phone with Wi-Fi and a browser (you have it)</li><li>Utility knife (you have it)</li><li>3D printer, yours, or one at a library or a makerspace (borrow)</li><li>Soldering iron kit, temperature control, stand, tip cleaner (buy)</li><li>Screwdriver set, small Phillips and 3 mm flat (buy)</li><li>Needle-nose pliers (buy)</li><li>Side cutters, for wire ends (buy)</li><li>Safety glasses, ANSI Z87.1 (buy)</li></ul>
<h2>Shopping list</h2>
<h3>1. Pololu</h3>
<p>Order the chassis kit, the encoders and the power board together. Order 7 days before you start.</p>
<ul><li>1 × kit: Romi chassis kit, Pololu 3506 or another color: base plate, 2 gearmotors, 2 wheels of 70 mm, ball caster, battery contacts, $39.95</li><li>1 × Power board, Pololu 3543 motor driver and power board for Romi, two DRV8838 drivers, 5 V regulator, power button, $34.95</li><li>1 × pair kit: Encoder, Pololu 3542 Romi encoder pair kit, 12 CPR, 3.5 to 18 V, with magnetic discs, $9.95</li></ul>
<h3>2. Online electronics shop</h3>
<p>Many shops sell the sensor modules in packs.</p>
<ul><li>1 × 1 kg spool: PLA filament, 1.75 mm, $19.99</li><li>1 × 50 g reel: Solder, lead-free, 0.8 mm, with flux core, $7.99</li><li>1 × Soldering iron kit, temperature control, stand, tip cleaner, $19.99</li><li>1 × pack of 50: Machine screw, M3 Ã— 6 mm, pan head, $3.99</li><li>1 × pack of 50: Machine screw, M3 Ã— 10 mm, pan head, $3.99</li><li>1 × pack of 5: Floor sensor, IR obstacle sensor module FC-51, 3.3 to 5 V, $5.99</li><li>1 × pack of 20: Standoff, M3 Ã— 15 mm, nylon, female-female, $4.99</li><li>1 × Expansion board, for a 30-pin ESP32 DevKit, a G, V and S pin for each GPIO, 5 V and 3.3 V pins, $6.99</li><li>1 × ESP32 board, ESP32-WROOM-32 DevKit, 30 pins, Wi-Fi, with USB cable, $8.99</li><li>1 × pack of 3: Motion sensor, MPU-6050 module (GY-521), 3 to 5 V, I2C, with header pins, $8.99</li><li>1 × pack of 4: Mini breadboard, 170 points, 47 Ã— 35 mm, $4.99</li><li>1 × pack of 3: Laser distance sensor, VL53L0X module (GY-530), 2.6 to 5.5 V, I2C, 25 Ã— 11 mm, with header pins, $12.99</li><li>1 × pack of 50: Nut, M3, $2.99</li><li>1 × pack of 5: Voltage sensor, 0 to 25 V module, 30 kÎ© and 7.5 kÎ© divider, screw terminal, $5.99</li><li>1 × pack of 3: Bump switch, end stop module with lever switch and 3-wire lead, $6.99</li><li>1 × set: Jumper wire set, 20 cm, 120 wires: 40 male-male, 40 male-female, 40 female-female, $6.99</li><li>2 × pack of 4: Rechargeable AA cell, NiMH, 1.2 V, 2000 mAh or more, $19.98</li><li>1 × Cell charger, for AA NiMH cells, automatic stop, UL listed, $14.99</li></ul>
<h3>3. Home store</h3>
<ul><li>1 × Safety glasses, ANSI Z87.1, $5.97</li><li>1 × Screwdriver set, small Phillips and 3 mm flat, $9.97</li><li>1 × Side cutters, for wire ends, $6.97</li><li>1 × 1 m roll: Hook-and-loop tape, 20 mm wide, self-adhesive, $5.99</li><li>1 × 1 m roll: Foam tape, double-sided, 1 mm thick, $4.99</li><li>1 × Needle-nose pliers, $7.97</li><li>1 × pack of 100: Cable tie, 100 mm, $3.99</li><li>1 × pack of 2: Sponge, foam, 80 Ã— 28 mm or larger, cut to 10 mm thick, $3.99</li><li>1 × pack of 6: Microfibre cloth, 300 Ã— 300 mm, $7.99</li></ul>
<h3>4. Borrow</h3>
<p>Ask a friend, a neighbour or a tool library.</p>
<ul><li>3D printer</li></ul>
<p>Total: $341.54, with 10% contingency.</p>
<h2>Steps</h2>
<ol>
<li><h3>Print the parts</h3>
<p><strong>WARNING:</strong> Do not touch the nozzle or the bed of the printer. They are hot enough to burn you.</p>
<ol><li>Open the three STL files from the parts folder of this guide in the slicer of your printer.</li><li>Put each part on the bed as the print list shows.</li><li>Slice each part with the settings in the print list.</li><li>Print the holder and the bar first.</li><li>When the bed is cool, remove the parts.</li><li>Print the cover.</li><li>Compare the contents of the Romi box with the kit rows in the Shop tab.</li><li>Cut the sponge to 80 Ã— 28 Ã— 10 mm with the knife.</li></ol>
<p><strong>Check:</strong> Make sure that the bar has three sensor pockets and that the cover has a window in its top.</p>
<p><strong>Why:</strong> The printer works while you build. You need the holder in step 5, the bar in step 8 and the cover in step 15.</p>
<p><strong>Tip:</strong> If you have no printer, a library, a makerspace or an online print service can print the parts.</p>
</li>
<li><h3>Install the battery contacts and the power board</h3>
<p><strong>WARNING:</strong> When you cut wire ends, wear safety glasses. A cut end can fly into your eyes.</p>
<p><strong>WARNING:</strong> Cut away from your other hand. The knife can slip and cut you.</p>
<p><strong>CAUTION:</strong> Do not put cells in the battery box during this step. A short circuit can damage the power board.</p>
<p><strong>WARNING:</strong> Put the soldering iron in its stand after each joint. The tip is hot enough to burn you and the bench.</p>
<p><strong>WARNING:</strong> Open a window or turn on a fan. Solder fumes can hurt your lungs.</p>
<ol><li>Push the two double battery contacts into the slots under the battery box.</li><li>Turn the base plate over.</li><li>Put the four single contacts into the box from the top.</li><li>Put power board F on the base plate, with the contact tabs through its holes.</li><li>Attach the power board with the two screws and nuts from its bag.</li><li>Solder each battery contact tab to the power board.</li><li>Cut each tab end to 2 mm with the side cutters.</li><li>Cut the trace between the two pads of the VCCMD jumper with the knife.</li><li>Cut the trace between the two pads of the VPU jumper with the knife.</li><li>Solder the two encoder sockets and the control pins to the power board.</li></ol>
<p><strong>Check:</strong> Make sure that each joint is shiny and that no solder touches the next pad. Make sure that each cut jumper shows a clean gap.</p>
<p><strong>Why:</strong> The ESP32 pins accept 3.3 V only. After the cuts, the 3.3 V of the ESP32 supplies the motor logic and the encoder signals.</p>
<p><strong>Tip:</strong> The Pololu page of the power board shows each jumper and each contact.</p>
</li>
<li><h3>Install the encoders and the gearmotors</h3>
<p><strong>CAUTION:</strong> Do not hit the magnetic disc onto the shaft. A hit can break the gearbox.</p>
<p><strong>WARNING:</strong> Put the soldering iron in its stand after each joint. The tip is hot enough to burn you and the bench.</p>
<p><strong>WARNING:</strong> Open a window or turn on a fan. Solder fumes can hurt your lungs.</p>
<ol><li>Put an encoder board E on the back terminals of each gearmotor B, with the sensors toward the motor.</li><li>Solder the two motor terminals to each encoder board.</li><li>Push a magnetic disc onto the back shaft of each motor until it is 1 mm from the encoder board.</li><li>Push each motor clip into the base plate until its bottom is even with the bottom of the plate.</li><li>Push each gearmotor into its clips, with the encoder pins down into the encoder socket of the power board.</li></ol>
<p><strong>Check:</strong> Make sure that each magnetic disc turns freely and does not touch the encoder board.</p>
<p><strong>Why:</strong> The encoders count the turns of each wheel. The robot uses the counts to calculate how far it went.</p>
</li>
<li><h3>Attach the wheels and the ball caster</h3>
<ol><li>Push a wheel C onto each motor shaft until the shaft is flush with the outer face of the wheel.</li><li>Turn the base plate upside down.</li><li>Put the three rollers in the cutouts at the back of the plate.</li><li>Put the ball on the rollers.</li><li>Push the caster clip over the ball until it locks.</li></ol>
<p><strong>Check:</strong> Make sure that each wheel and the ball turn freely and that no wheel touches the base plate.</p>
<p><strong>Why:</strong> The two wheels are on one line through the centre, so the robot turns in place. The caster carries the back of the robot.</p>
</li>
<li><h3>Attach the front holder and the floor sensors</h3>
<p><strong>CAUTION:</strong> Hold each sensor by its edges. Static electricity from your fingers can damage it.</p>
<ol><li>Put front holder J under the front of the base plate, with its sensor pockets to the front.</li><li>Install two 10 mm machine screws down through the base plate into the holder.</li><li>Push a floor sensor L up through each front slot of the base plate.</li><li>Turn each sensor so that its two IR lights point down, 4 mm above the floor.</li><li>Attach each sensor in its pocket on the holder with a 6 mm machine screw.</li></ol>
<p><strong>Check:</strong> Make sure that the bottom of each floor sensor is 3 to 5 mm above a flat floor.</p>
<p><strong>Why:</strong> The floor sensors are at the front corners. They find the edge of a step before a wheel gets there.</p>
</li>
<li><h3>Attach the expansion board</h3>
<p><strong>CAUTION:</strong> Hold the expansion board by its edges. Static electricity from your fingers can damage the board.</p>
<ol><li>Put expansion board G on the back half of the base plate.</li><li>Find four holes in the base plate below the four holes of the board.</li><li>Remove the board.</li><li>Attach a standoff H above each hole with a 6 mm machine screw from below.</li><li>If a hole is on the top of the battery box, cut that standoff to 5 mm.</li><li>Put the expansion board on the standoffs, with its USB end to the back.</li><li>Attach the board with four 6 mm machine screws.</li><li>If the board has a jumper for the voltage of the V pins, set it to 3.3 V.</li></ol>
<p><strong>Check:</strong> Make sure that no pin under the board touches the base plate or the battery box.</p>
<p><strong>Why:</strong> The expansion board gives each ESP32 pin its own G, V and S pins. Most sensors plug in with no soldering.</p>
</li>
<li><h3>Install the ESP32, the breadboard and the motion sensor</h3>
<p><strong>WARNING:</strong> Cut away from your other hand. The knife can slip and cut you.</p>
<p><strong>CAUTION:</strong> Hold each board by its edges. Static electricity from your fingers can damage it.</p>
<p><strong>WARNING:</strong> Put the soldering iron in its stand after each joint. The tip is hot enough to burn you and the bench.</p>
<p><strong>WARNING:</strong> Open a window or turn on a fan. Solder fumes can hurt your lungs.</p>
<ol><li>Align the pin labels of ESP32 board Q with the labels on the expansion board.</li><li>Push the ESP32 down evenly until its pins are fully in the sockets.</li><li>Solder the eight header pins to motion sensor I, with the long ends on the side opposite the chip.</li><li>Cut a 50 mm strip of hook-and-loop tape.</li><li>Attach the strip to the bottom of breadboard R and to the base plate, in front of the expansion board.</li><li>Push the pins of the motion sensor into the back row of the breadboard, with the chip up.</li><li>Make sure that the motion sensor board is out past the back edge.</li></ol>
<p><strong>Check:</strong> Make sure that each pin of the motion sensor is in a different 5-hole strip of the breadboard.</p>
<p><strong>Why:</strong> The motion sensor contains a gyro. The gyro measures each turn of the robot, so the robot knows its direction. Each 5-hole strip connects the wires in it.</p>
<p><strong>Tip:</strong> If the battery box has its cover on the top, pull the breadboard off to change the cells.</p>
</li>
<li><h3>Attach the sensor bar and the distance sensors</h3>
<p><strong>WARNING:</strong> Cut away from your other hand. The knife can slip and cut you.</p>
<p><strong>CAUTION:</strong> Do not touch the window of a sensor chip. Dirt on the window gives wrong distances.</p>
<p><strong>WARNING:</strong> Put the soldering iron in its stand after each joint. The tip is hot enough to burn you and the bench.</p>
<p><strong>WARNING:</strong> Open a window or turn on a fan. Solder fumes can hurt your lungs.</p>
<ol><li>Solder the six header pins to each distance sensor M, with the long ends opposite the chip.</li><li>Cut six pieces of foam tape, 10 Ã— 3 mm.</li><li>Attach a piece to each end of the back face of each sensor board.</li><li>Push each sensor into a pocket of sensor bar S, with the chip out and the pins in the channel.</li><li>Put the bar on the front edge of the base plate, with its two notches over the floor sensors.</li><li>Align each slot under the bar with a hole of the base plate.</li><li>Install a 10 mm machine screw up through each hole into the slot.</li></ol>
<p><strong>Check:</strong> Make sure that each sensor chip points out of its pocket. Make sure that no wire is in front of a chip.</p>
<p><strong>Why:</strong> Each laser sensor measures the distance to an object in its beam of 25Â°. The pockets tilt the beams 8Â° up, so the floor stays out of the beams.</p>
</li>
<li><h3>Attach the bump switches and the voltage sensor</h3>
<ol><li>Put a bump switch N on each side of the front, with its lever to the front and out.</li><li>Align the two holes of each switch with two holes in the base plate.</li><li>Install two 10 mm machine screws up through the base plate.</li><li>Put a nut on each screw.</li><li>Bend each lever until its end is 10 mm past the edge of the base plate.</li><li>Attach voltage sensor V to the base plate with hook-and-loop tape, at the left of the expansion board.</li></ol>
<p><strong>Check:</strong> Make sure that each switch clicks at a light push on its lever.</p>
<p><strong>Why:</strong> The levers touch a chair leg before the base plate does. The voltage sensor lets the robot measure its battery.</p>
<p><strong>Tip:</strong> Left and right are as the robot faces forward.</p>
</li>
<li><h3>Connect the power, motor and encoder wires</h3>
<p><strong>WARNING:</strong> Remove the cells before you connect a wire. A short circuit can make the wires hot enough to burn you.</p>
<p><strong>CAUTION:</strong> Do not connect a 5 V pin to an ESP32 pin. Its pins accept 3.3 V only.</p>
<ol><li>Remove all cells from the battery box.</li><li>Connect the VREG pin of the power board to the 5V pin of the expansion board.</li><li>Connect a GND pin of the power board to a GND pin of the expansion board.</li><li>Connect the 3V3 pin of the expansion board to the breadboard strip below the VCC pin of the motion sensor.</li><li>Connect that strip to the VCC strip of the motion sensor with a short wire.</li><li>Connect the VCCMD pin and the VPU pin of the power board to that strip below the VCC pin.</li><li>Connect a G pin of the expansion board to the GND strip of the motion sensor.</li><li>Connect PWM and DIR of the left motor channel to the S pins of GPIO 25 and GPIO 26.</li><li>Connect PWM and DIR of the right motor channel to the S pins of GPIO 27 and GPIO 13.</li><li>Connect A and B of the left encoder to the S pins of GPIO 34 and GPIO 35.</li><li>Connect A and B of the right encoder to the S pins of GPIO 18 and GPIO 19.</li><li>Connect the OFF pin of the power board to the S pin of GPIO 32.</li><li>Attach the wires to the base plate with cable ties.</li></ol>
<p><strong>Check:</strong> Compare each wire with the pin list in the file config.h.</p>
<p><strong>Why:</strong> VREG gives 5 V when the power button is on. The ESP32 makes 3.3 V from it for itself, the sensors, the motor logic and the encoders.</p>
</li>
<li><h3>Connect the sensors</h3>
<ol><li>Connect the S pin of GPIO 21 to the SDA strip of the motion sensor.</li><li>Connect the S pin of GPIO 22 to the SCL strip.</li><li>Connect VIN and GND of each distance sensor to the VCC and GND strips of the motion sensor.</li><li>Connect SCL and SDA of each distance sensor to the SCL and SDA strips of the motion sensor.</li><li>Connect XSHUT of the left distance sensor to the S pin of GPIO 16.</li><li>Connect XSHUT of the centre distance sensor to the S pin of GPIO 17.</li><li>Connect XSHUT of the right distance sensor to the S pin of GPIO 23.</li><li>Connect the lead of the left bump switch to the pin row of GPIO 14.</li><li>Connect the lead of the right bump switch to the pin row of GPIO 4.</li><li>Connect the left floor sensor to the pin row of GPIO 36.</li><li>Connect the right floor sensor to the pin row of GPIO 39.</li><li>Connect the VSW pin of the power board to the + terminal of the voltage sensor.</li><li>Connect a GND pin of the power board to the âˆ’ terminal of the voltage sensor.</li><li>Connect S of the voltage sensor to the S pin of GPIO 33.</li><li>Connect âˆ’ of the voltage sensor to a G pin of the expansion board.</li><li>Attach the wires to the base plate with cable ties.</li></ol>
<p><strong>Check:</strong> Make sure that each 3-wire lead has its GND wire on the G pin of its row.</p>
<p><strong>Why:</strong> The four sensors on the I2C bus share the same four wires. Each distance sensor has its own XSHUT wire, so the program can give it its own address.</p>
<p><strong>Tip:</strong> On some expansion boards, GPIO 36 is VP and GPIO 39 is VN.</p>
</li>
<li><h3>Load the program</h3>
<p><strong>CAUTION:</strong> Disconnect the wire from the VREG pin before you connect the USB cable. Two 5 V supplies together can damage the boards.</p>
<ol><li>Install the free Arduino IDE 2 on your computer from arduino.cc.</li><li>Install the board package esp32 by Espressif Systems, version 3.0 or later, from the Boards Manager of the IDE.</li><li>Install the library VL53L0X by Pololu from the Library Manager.</li><li>Open the file cleaner.ino in the cleaner folder of this guide.</li><li>Replace the Wi-Fi password in the file config.h with a password of your own.</li><li>Disconnect the wire from the VREG pin of the power board.</li><li>Connect ESP32 board Q to the computer with the USB cable.</li><li>Select the board ESP32 Dev Module and its port in the Tools menu.</li><li>Select Upload in the Sketch menu.</li><li>Wait until the IDE shows that the upload is complete.</li><li>Put the robot on the floor, with the USB cable still connected.</li><li>Turn the adjustment screw of each floor sensor slowly until its light comes on.</li><li>Lift the front of the robot 20 mm.</li><li>Make sure that the light of each floor sensor goes off.</li><li>Disconnect the USB cable.</li><li>Connect the wire to the VREG pin again.</li></ol>
<p><strong>Check:</strong> Make sure that the light of each floor sensor is on at the floor and off 20 mm higher.</p>
<p><strong>Why:</strong> The USB cable gives power to the ESP32 and the sensors only. The motors stay off during this step.</p>
<p><strong>Tip:</strong> A black or a shiny floor reflects little light. If a light stays off on that floor, turn its screw more.</p>
</li>
<li><h3>Test the robot with the app</h3>
<p><strong>WARNING:</strong> If a cell or the power board becomes hot or smells, press the power button and remove the cells. A short circuit can start a fire.</p>
<p><strong>CAUTION:</strong> Do not test the robot near a step or a table edge. A wrong wire can stop the floor sensors.</p>
<ol><li>Charge six NiMH cells in the charger.</li><li>Put the cells in the battery box as the marks in the box show.</li><li>Put the robot on the floor, 1 m or more from a wall and from a step.</li><li>Press the power button on the power board.</li><li>Connect your phone to the Wi-Fi network FloorBot with your password from config.h.</li><li>Open http://192.168.4.1 in the browser of the phone.</li><li>Select Sensors, and then select Self test.</li><li>Wait until the message shows Self test passed.</li><li>If the message shows a fault, do the repair that the message gives.</li><li>Do the self test again.</li><li>Put a hand 5 cm in front of each distance sensor.</li><li>Make sure that the app shows about 50 mm for that sensor.</li><li>Push each bump lever with a finger.</li><li>Make sure that the app shows PUSHED for that switch.</li><li>Lift the front of the robot 20 mm.</li><li>Make sure that the app shows NO FLOOR for each floor sensor.</li></ol>
<p><strong>Check:</strong> Make sure that the self test passed. When you test a sensor, make sure that its row in the app changes.</p>
<p><strong>Why:</strong> The self test finds the direction of each motor and each encoder with the gyro, and keeps the result. This test finds a wrong wire before you trust the robot near a step.</p>
<p><strong>Tip:</strong> Plug the charger into a wall outlet only to charge the cells. The robot never connects to an outlet.</p>
</li>
<li><h3>Fit the pad</h3>
<p><strong>WARNING:</strong> Cut away from your other hand. The knife can slip and cut you.</p>
<p><strong>CAUTION:</strong> Use a dry or a well wrung cloth. Water that drips on the boards can damage them.</p>
<ol><li>Attach a hook strip to the bottom face of holder J.</li><li>Cut a strip of microfibre cloth 100 Ã— 60 mm.</li><li>Wrap the cloth around pad K.</li><li>Press the wrapped pad on the hook strip, under the holder.</li></ol>
<p><strong>Check:</strong> Make sure that the cloth touches the floor along the full width of the pad.</p>
<p><strong>Why:</strong> The hooks grip the cloth, so you can remove the cloth and wash it.</p>
</li>
<li><h3>Fit the cover</h3>
<p><strong>WARNING:</strong> Cut away from your other hand. The knife can slip and cut you.</p>
<ol><li>Cut three 20 mm squares of hook-and-loop tape.</li><li>Attach a square to the bottom of each tab inside cover T.</li><li>Put the cover on the robot, with the open side to the front.</li><li>Press the cover down, so that each square attaches to the base plate.</li><li>Remove chairs, cables and small objects from the floor.</li><li>Put the robot in the middle of the room, on a hard floor.</li><li>Press the power button through the window in the cover.</li><li>Select Auto in the app.</li><li>Do not lift the robot until it is back at its start point.</li></ol>
<p><strong>Check:</strong> Make sure that the map in the app shows the clean area grow lane by lane.</p>
<p><strong>Why:</strong> The robot finds its position from the wheel counts and the gyro. If you lift it, its map is wrong.</p>
<p><strong>Tip:</strong> One charge runs the robot for about 1 hour. A room of 12 mÂ² takes about 25 minutes. The robot goes home when the battery is low.</p>
</li>
</ol>
<h2>What moves</h2>
<ul><li>Cover (part T): slides 60 mm. The cover lifts off. Under it are the boards, the sensors and the battery.</li><li>Left wheel (part C): turns 360 degrees. One full turn of the wheel moves the robot 220 mm.</li><li>Right wheel (part C): turns 360 degrees. The two wheels turn at different speeds when the robot turns.</li></ul></div></noscript>

vers","pliers"],"do":["Put a bump switch N on each side of the front, with its lever to the front and out.","Align the two holes of each switch with two holes in the base plate.","Install two 10 mm machine screws up through the base plate.","Put a nut on each screw.","Bend each lever until its end is 10 mm past the edge of the base plate.","Attach voltage sensor V to the base plate with hook-and-loop tape, at the left of the expansion board."],"check":"Make sure that each switch clicks at a light push on its lever.","why":"The levers touch a chair leg before the base plate does. The voltage sensor lets the robot measure its battery.","tip":"Left and right are as the robot faces forward.","from":[0,100,0],"view":{"az":0,"el":40,"zoom":1.2},"index":8,"wait":0},{"id":"power-wires","title":"Connect the power, motor and encoder wires","phase":"Wiring","minutes":30,"uses":{"jumpers":1,"ties":4},"teach":["jumper"],"warn":[{"type":"warning","text":"Remove the cells before you connect a wire. A short circuit can make the wires hot enough to burn you."},{"type":"caution","text":"Do not connect a 5 V pin to an ESP32 pin. Its pins accept 3.3 V only."}],"do":["Remove all cells from the battery box.","Connect the VREG pin of the power board to the 5V pin of the expansion board.","Connect a GND pin of the power board to a GND pin of the expansion board.","Connect the 3V3 pin of the expansion board to the breadboard strip below the VCC pin of the motion sensor.","Connect that strip to the VCC strip of the motion sensor with a short wire.","Connect the VCCMD pin and the VPU pin of the power board to that strip below the VCC pin.","Connect a G pin of the expansion board to the GND strip of the motion sensor.","Connect PWM and DIR of the left motor channel to the S pins of GPIO 25 and GPIO 26.","Connect PWM and DIR of the right motor channel to the S pins of GPIO 27 and GPIO 13.","Connect A and B of the left encoder to the S pins of GPIO 34 and GPIO 35.","Connect A and B of the right <script type="module">
const { createViewer } = (() => {
// The 3D step viewer. No static import: createViewer() loads three.js with import() and, on failure, writes the
// reason into the viewer slot. Parts already built are plain, the parts of this step are lit and arrive along their
// path, parts still to come are hidden (or ghosted), and X-ray shows the parts built before as glass. Units are
// millimetres, y is up. One WebGL renderer is shared: only the viewer on screen owns the canvas.
// The Plan view (hero) tours itself: the finished object turns and shows each motion, then goes together step by step,
// as a pure function of the tour time (tourPose). Any input hands control to the reader; 25 s of quiet hands it back.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const CAPTURE = /[?&]capture\b/.test(location.search); // keep the drawing buffer only for screen captures
const TOUR_AT = Number(new URLSearchParams(location.search).get("tour")); // capture: the tour time to show
const IDLE = 25000; // ms of quiet before the tour starts again
const PIXELS = [1.5, 1, 0.75]; // the pixel ratio of each quality tier; tier 1 also halves the shadow map, tier 2 drops shadows
const MSG = {
  webgl: "3D needs WebGL. The steps still work without it.",
  network: "3D needs a network connection. The steps still work without it.",
};
const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const isVec = (v) => Array.isArray(v) && v.length === 3 && v.every((x) => typeof x === "number" && Number.isFinite(x));
let THREE = null, Orbit = null, loading = null, shared = null;

// WebGL first (a test canvas), then the two modules. Each failure carries its reason.
function hasWebGL() {
  try {
    const c = document.createElement("canvas"), gl = c.getContext("webgl2") || c.getContext("webgl");
    gl?.getExtension("WEBGL_lose_context")?.loseContext();
    return Boolean(gl);
  } catch { return false; }
}
function load3d() {
  return (loading ??= (async () => {
    if (!hasWebGL()) throw Object.assign(new Error("WebGL is not available"), { reason: "webgl" });
    try {
      const [t, o] = await Promise.all([import("three"), import("three/addons/controls/OrbitControls.js")]);
      THREE = t;
      Orbit = o.OrbitControls;
    } catch (e) { throw Object.assign(new Error(e?.message ?? String(e)), { reason: "network" }); }
  })());
}

function fail(host, err) {
  const p = document.createElement("p");
  p.className = "vmsg";
  p.textContent = err?.reason ? MSG[err.reason] : `3D error: ${err?.message ?? err}. The steps still work without it.`;
  host.replaceChildren(p);
  host.dataset.state = err?.reason ?? "error";
  if (!err?.reason) console.warn("jig 3D:", err);
}

// One renderer for the page. The canvas moves to the viewer that is on screen.
function renderer() {
  if (shared) return shared;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: CAPTURE });
  r.setPixelRatio(Math.min(devicePixelRatio, PIXELS[0]));
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  const c = r.domElement;
  c.tabIndex = 0;
  c.setAttribute("role", "img");
  c.addEventListener("keydown", (e) => { if (shared.owner?.key(e)) { e.preventDefault(); e.stopPropagation(); } });
  // tier: 0 full quality. A slow frame rate (a laptop's built-in GPU) steps it down; the viewers apply it on their next frame.
  return (shared = { r, canvas: c, owner: null, tier: 0, perf: { n: 0, sum: 0 } });
}

// createViewer(host, data, { mode: "hero" | "steps", label, onSpin, onTour }) -> viewer API, or null when 3D cannot run.
// Every shader compiles before the first frame (compileAsync), so the page does not stop on its first draw.
async function createViewer(host, data, opts = {}) {
  try { await load3d(); } catch (e) { fail(host, e); return null; }
  try {
    const v = build(host, data, opts);
    await v.warm();
    return v;
  } catch (e) { fail(host, e); return null; }
}

function build(host, data, { mode = "steps", label = "3D view", onSpin, onTour } = {}) {
  const T = THREE, hero = mode === "hero", R = renderer(), canvas = R.canvas;
  const box = host.querySelector("[data-canvas]"), layer = host.querySelector("[data-tags]");
  const UP = new T.Vector3(0, 1, 0), V = (a) => new T.Vector3(...a), RAD = Math.PI / 180;

  // ---- theme tokens
  const tok = {};

    const cs = getComputedStyle(host);
    for (const k of ["ink", "accent", "grid"]) tok[k] = cs.getPropertyValue(`--v-${k}`).trim() || "#888888";
    const shade = parseFloat(cs.getPropertyValue("--v-prop")); // props (a white wall) are dimmed in the dark theme
    tok.prop = shade > 0 && shade <= 1 ? shade : 1;
  };
  readTokens();

  // ---- lights and floor
  const hemi = new T.HemisphereLight(0xffffff, 0x8a7f72, 2.1);
  const sun = new T.DirectionalLight(0xffffff, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  sun.shadow.bias = -0.0004;
  scene.add(hemi, sun, sun.target);
  const floor = new T.Mesh(new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new T.ShadowMaterial({ opacity: 0.18 }));
  floor.receiveShadow = true;
  scene.add(floor);

  // ---- shapes: a box, or a cylinder along the side that is not one of the two equal sides
  const axisOf = ([x, y, z]) => { const eq = (a, b) => Math.abs(a - b) < 1e-6; return eq(x, z) ? 1 : eq(x, y) ? 2 : eq(y, z) ? 0 : -1; };
  function shape(kind, size) {
    const axis = kind === "cylinder" ? axisOf(size) : -1;
    if (axis < 0) return new T.BoxGeometry(...size);
    const r = size[(axis + 1) % 3] / 2, g = new T.CylinderGeometry(r, r, size[axis], 28);
    if (axis === 0) g.rotateZ(Math.PI / 2);
    if (axis === 2) g.rotateX(Math.PI / 2);
    return g;
  }
  function solid(g, mat, edge) {
    const m = new T.Mesh(g, mat);
    m.castShadow = m.receiveShadow = true;
    if (edge) m.add(new T.LineSegments(new T.EdgesGeometry(g, 30), edge));
    return m;
  }
  // rotate [rx, ry, rz] degrees about the box centre, x then y then z (R = Rz Ry Rx, as geometry.mjs)
  const turn = (m, r) => { if (isVec(r)) m.rotation.set(r[0] * RAD, r[1] * RAD, r[2] * RAD, "ZYX"); };

  // ---- parts: an assembled mesh and a flat "kit" mesh share one material per part
  for (const p of data.parts) if (!isVec(p.at) || !isVec(p.size)) throw new Error(`part ${p.id} has no position ("at") or size`);
  const parts = data.parts.map((p, i) => {
    const size = V(p.size), center = V(p.at).addScaledVector(size, 0.5);
    const base = new T.Color(p.color || "#cfc6b8");
    base.offsetHSL(0, 0, (((i * 37) % 7) - 3) * 0.008); // a little variation, like real boards
    const mat = new T.MeshLambertMaterial({ color: base.clone() }), edge = new T.LineBasicMaterial({ color: tok.ink, transparent: true });
    const mesh = solid(shape(p.shape, p.size), mat, edge);
    mesh.position.copy(center);
    turn(mesh, p.rotate);
    mesh.updateMatrixWorld();
    const wb = new T.Box3().setFromObject(mesh);
    const flat = [...p.size].sort((a, b) => b - a), round = p.shape === "cylinder" && axisOf(p.size) >= 0;
    const kitSize = round ? [p.size[axisOf(p.size)], p.size[(axisOf(p.size) + 1) % 3], p.size[(axisOf(p.size) + 1) % 3]] : [flat[0], flat[2], flat[1]];
    const kit = p.kind === "each" ? null : solid(shape(p.shape, kitSize), mat, edge); // bought parts are not cut; printed parts lie in the kit too
    // q0: the part's own rotation. mq, pivot, slide: where a motion has moved it (the Plan view only).
    return { ...p, i, center, base, mat, edge, mesh, kit, kitSize, round, offset: new T.Vector3(), fly: new T.Vector3(), state: "hidden", wb,
      q0: mesh.quaternion.clone(), mq: new T.Quaternion(), pivot: new T.Vector3(), slide: new T.Vector3(), motion: null };
  });
  // the motions of the finished object: one value k (0 rest, 1 the full travel) poses their parts
  const AX = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const motions = (Array.isArray(data.motions) ? data.motions : []).map((m) => {
    const list = parts.filter((p) => (m.parts ?? []).includes(p.id) && !p.motion);
    const mo = { ...m, list, axis: V(AX[m.axis] ?? AX.y), pivot: isVec(m.pivot) ? V(m.pivot) : new T.Vector3(), k: 0 };
    list.forEach((p) => (p.motion = mo));
    return mo;
  }).filter((m) => m.list.length && Number.isFinite(m.travel));
  const assembly = new T.Group(), kitGroup = new T.Group();
  parts.forEach((p) => { assembly.add(p.mesh); if (p.kit) kitGroup.add(p.kit); });
  scene.add(assembly, kitGroup);

  // ---- props (wall, bench): context only, never in the bill
  const props = Object.entries(data.props || {}).filter(([, pr]) => isVec(pr.at) && isVec(pr.size)).map(([id, pr]) => {
    const base = new T.Color(pr.color || "#e6e1d8"), m = solid(shape(pr.shape, pr.size), new T.MeshLambertMaterial({ color: base.clone().multiplyScalar(tok.prop) }), null);
    m.position.copy(V(pr.at).addScaledVector(V(pr.size), 0.5));
    turn(m, pr.rotate);
    m.castShadow = false;
    m.visible = false;
    scene.add(m);
    m.updateMatrixWorld(true);
    // props never move: their world box (0.5 mm inside, so a part that only touches one is not in it) stops "Apart"
    return { id, m, base, hero: pr.hero !== false, box: new T.Box3().setFromObject(m).expandByScalar(-0.5) };
  });

  // the camera frames the parts. A repair has no parts: the object that is there (the props of the Plan view) sets it.
  const bounds = new T.Box3();
  parts.forEach((p) => bounds.union(p.wb));
  if (bounds.isEmpty()) props.filter((pr) => pr.hero).forEach((pr) => bounds.union(new T.Box3().setFromObject(pr.m)));
  if (bounds.isEmpty()) bounds.set(new T.Vector3(-100, 0, -100), new T.Vector3(100, 200, 100));

  const kitBox = new T.Box3();

    for (const p of cut) {

      p.kit.position.set(x + p.kitSize[0] / 2, p.kitSize[1] / 2, z + p.kitSize[2] / 2);
      kitBox.union(new T.Box3().setFromCenterAndSize(p.kit.position, V(p.kitSize)));
      x += p.kitSize[0] + gap;
      rowDepth = Math.max(rowDepth, p.kitSize[2]);
    }
    if (!kitBox.isEmpty()) {
      const kc = kitBox.getCenter(new T.Vector3());
      kitGroup.position.set(modelCenter.x - kc.x, 0, modelCenter.z - kc.z);
      kitBox.translate(kitGroup.position);
    }
  }

  // ---- fasteners: one InstancedMesh pair (shaft + head) per type; head at `at`, the shaft runs along `dir`
  const HEADS = {
    flat: (d) => new T.CylinderGeometry(d, d * 0.5, d * 0.6, 16).translate(0, -d * 0.2, 0),
    pan: (d) => new T.CylinderGeometry(d * 0.8, d * 0.95, d * 0.6, 16).translate(0, d * 0.3, 0),
    hex: (d) => new T.CylinderGeometry(d * 0.95, d * 0.95, d * 0.7, 6).translate(0, d * 0.35, 0),
  };
  const types = new Map(), fast = [];
  data.steps.forEach((s, si) => (s.fasteners || []).forEach((f, fi) => {
    if (!isVec(f.at)) return; // a counted fastener: in the bill, not drawn
    if (!isVec(f.dir) || !f.dir.some((v) => v !== 0)) throw new Error(`fastener ${fi + 1} of step ${si + 1} has no direction ("dir")`);
    const len = f.len > 0 ? f.len : 30, d = f.d > 0 ? f.d : 4, head = Object.hasOwn(HEADS, f.head ?? "") ? f.head : "flat";
    const key = `${len}|${d}|${head}|${f.color || ""}`;
    if (!types.has(key)) types.set(key, { len, d, head, base: new T.Color(f.color || "#8f959c"), list: [] });
    const t = types.get(key), dir = V(f.dir).normalize();
    const item = { step: si, t, k: t.list.length, home: V(f.at), dir, len, q: new T.Quaternion().setFromUnitVectors(UP, dir.clone().negate()), state: "hidden" };
    t.list.push(item);
    fast.push(item);
  }));
  for (const t of types.values()) {
    const mat = new T.MeshLambertMaterial({ color: 0xffffff });
    t.meshes = [new T.CylinderGeometry(t.d / 2, t.d * 0.3, t.len, 10).translate(0, -t.len / 2, 0), HEADS[t.head](t.d)].map((g) => {
      const m = new T.InstancedMesh(g, mat, t.list.length);
      m.castShadow = true;
      m.frustumCulled = false;
      for (let k = 0; k < t.list.length; k++) m.setColorAt(k, t.base);
      scene.add(m);
      return m;
    });
  }
  // A fastener moves with its host when the parts move apart: the part its shank enters first, just past the head
  // (installed by its step; the smallest box when parts overlap). With no host it hides while the parts are apart.

  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity], R = Math.PI / 180;
  const body = D.parts.filter((p) => p.role !== "anchor"), placed = (list) => list.filter((p) => isVec(p.at) && isVec(p.size));
  let list = placed(body.length ? body : D.parts);
  if (!list.length) list = placed(Object.values(D.props ?? {}).filter((p) => p && p.hero !== false));
  for (const p of list) {
    const hs = p.size.map((s) => s / 2), c = p.at.map((a, i) => a + hs[i]);
    let e = hs;
    if (isVec(p.rotate) && p.rotate.some((d) => d % 360)) {
      const [cx, sx, cy, sy, cz, sz] = [0, 0, 1, 1, 2, 2].map((a, i) => (i % 2 ? Math.sin : Math.cos)(p.rotate[a] * R));
      e = [[cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx], [sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx], [-sy, cy * sx, cy * cx]]
        .map((row) => row.reduce((a, r, j) => a + Math.abs(r) * hs[j], 0));
    }
    c.forEach((v, i) => { lo[i] = Math.min(lo[i], v - e[i]); hi[i] = Math.max(hi[i], v + e[i]); });
  }
  return lo[0] === Infinity ? null : hi.map((v, i) => v - lo[i]);
}

// The WARNING and CAUTION blocks of a step: its own, then those of the cards it teaches (every level sees them).
function warningsOf(s) {
  const seen = new Set();
  return [...(s.warn ?? []), ...(s.teach ?? []).flatMap((id) => D.techniques[id]?.warn ?? [])].filter((w) => w?.text && !seen.has(w.type + w.text) && seen.add(w.type + w.text));
}

const stepChip = (i) => h`<button type="button" data-go="${i}" aria-label="Step ${i + 1}: ${D.steps[i].title}" title="${D.steps[i].title}">${i + 1}</button>`;

const viewerBox = (mode) => h`<div class="viewer" data-viewer="${mode}"><div data-canvas></div><div data-tags></div>
<p class="hint" aria-hidden="true"><span class="h-mouse">Drag to turn. Scroll to zoom.</span><span class="h-touch">Tap the view to turn it.</span><span class="h-on">Drag to turn. Tap outside to scroll.</span></p>
<div class="vbar"><div class="vtools">${mode === "hero" ? h`<button type="button" data-v="spin" aria-label="Pause the tour">Pause</button>`

      ${get.length > 0 && h`<li><span class="pill">Get</span><span>${get.map((t) => `${count(t)}${t.name}${t.get === "borrow" ? " (borrow)" : t.get === "rent" ? " (rent)" : ""}`).join(", ")}</span></li>`}

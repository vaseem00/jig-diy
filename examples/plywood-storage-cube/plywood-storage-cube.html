<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Plywood storage cube guide</title>
<meta name="description" content="A storage cube of 18 mm birch plywood, 400 mm on each side. You cut five parts with a jigsaw, join them with glue and screws, and nail on a thin back.">
<meta name="generator" content="jig 1.0.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
/* jig guide page. Light tokens on :root; dark under prefers-color-scheme and [data-theme="dark"]. Text pairs >= 4.5:1, --control >= 3:1. */
:root{--page:#f3f0e8;--card:#fbfaf6;--ink:#1d1b18;--text:#2f2c27;--muted:#67625a;--line:#d8d2c5;--control:#8a8275;--faint:#ebe6db;--accent:#b04510;--accent-ink:#ffffff;--warn:#a3261b;--warn-bg:#fbe8e4;--caution:#7d5300;--caution-bg:#fbf0d6;--ok:#2f7a3d;--wood-ink:#1d1b18;
--v-ink:#3b352d;--v-accent:#ec6a1c;--v-grid:#d3cbbc;--v-prop:1;--display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#131210;--card:#1b1a17;--ink:#f4f0e8;--text:#d9d4ca;--muted:#9d978d;--line:#35322c;--control:#716b61;--faint:#24221e;--accent:#ff8a4c;--accent-ink:#1b1a17;--warn:#ff9a8b;--warn-bg:#3a1713;--caution:#f3c46a;--caution-bg:#33270e;--ok:#7fd18b;--v-ink:#2a2620;--v-accent:#ff7a2e;--v-grid:#3a3731;--v-prop:.42;color-scheme:dark}}
:root[data-theme="dark"]{--page:#131210;--card:#1b1a17;--ink:#f4f0e8;--text:#d9d4ca;--muted:#9d978d;--line:#35322c;--control:#716b61;--faint:#24221e;--accent:#ff8a4c;--accent-ink:#1b1a17;--warn:#ff9a8b;--warn-bg:#3a1713;--caution:#f3c46a;--caution-bg:#33270e;--ok:#7fd18b;--v-ink:#2a2620;--v-accent:#ff7a2e;--v-grid:#3a3731;--v-prop:.42;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--page)}
/* the sticky tab bar covers the top 64px: focus and scrollIntoView keep what they show below it (WCAG 2.4.11); no bar with one tab */
html{scroll-padding-top:64px}
html:has(.jig[data-single]){scroll-padding-top:0}
body{margin:0;color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.jig{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);color:var(--ink);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
h1{font-size:clamp(30px,5.6vw,46px);line-height:1.04;font-weight:700}
h2{font-size:24px;line-height:1.15}
h3{font-size:16px}
h2[tabindex]{scroll-margin-top:8px}
h2[tabindex]:focus{outline:none}
h2[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;max-width:62ch;margin:10px 0 0}
.lede.sm{font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--text);background:var(--card);border:1px solid var(--control);padding:9px 12px;border-radius:7px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--ink);color:var(--ink)}
button:disabled,button[aria-disabled="true"]{opacity:.55;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{accent-color:var(--ok)}

/* top bar and tabs */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 24px;margin-bottom:18px}
.level{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.level .eyebrow{margin-right:6px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:10px 4px;margin:0 -4px 18px;background:var(--page);border-bottom:1px solid var(--line)}
.tabs [role="tab"]{border-radius:999px;white-space:nowrap}
.tabs [role="tab"][aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
[data-panel][hidden]{display:none}
[role="tabpanel"]:focus-visible{outline-offset:6px;border-radius:6px}

/* cards and grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.stats div{background:var(--card);padding:12px 14px;min-width:0}
.stats b{display:block;font:700 22px/1.1 var(--display);color:var(--ink);overflow-wrap:anywhere}
.stats span{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:18px;min-width:0}

/* viewer: pan-y lets a finger scroll the page; a tap on the view turns on one-finger orbit */
.viewer{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,var(--card),var(--faint));aspect-ratio:16/11;min-height:280px;touch-action:pan-y}
.viewer [data-canvas]{position:absolute;inset:0}
.viewer canvas{width:100%!important;height:100%!important;display:block;touch-action:pan-y}
.viewer[data-active] canvas{touch-action:none}
.viewer canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.viewer [data-tags]{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--card);border:1.5px solid var(--accent);color:var(--ink);font:700 12px/19px var(--mono);text-align:center;box-shadow:0 1px 3px #0003}
.pin{position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--card) 70%,transparent)}
/* from 360 px wide the buttons stay on one row (on a narrower screen they can go on two rows): a readout that does not
   fit beside them goes above them (wrap-reverse) on one line, and only a readout wider than the whole bar ends in "…"
   (app.js puts the full text in its title). A phone (520 px or less) has no readout. */
.vbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:end;gap:4px 8px;pointer-events:none}
.vbar>*{pointer-events:auto}
.vtools{display:flex;gap:4px;flex-wrap:wrap}
.viewer:not([data-ready]) .vtools{visibility:hidden}
.vtools button{padding:7px 9px;font-size:11px;background:color-mix(in srgb,var(--card) 92%,transparent)}
.vtools button[aria-pressed="true"]{background:var(--ink)}
.readout{font:500 11px/1.3 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--card) 90%,transparent);padding:6px 8px;border-radius:6px;text-align:right;margin-left:auto;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;left:10px;top:10px;margin:0;max-width:calc(100% - 20px);padding:4px 7px;border-radius:6px;background:color-mix(in srgb,var(--card) 90%,transparent);font:500 11px/1.3 var(--mono);color:var(--muted);pointer-events:none}
.hint .h-touch,.hint .h-on{display:none}
@media (pointer:coarse){.hint .h-mouse{display:none}.hint .h-touch{display:inline}.viewer[data-active] .hint .h-touch{display:none}.viewer[data-active] .hint .h-on{display:inline}}
.viewer[data-user]:not([data-active]) .hint{opacity:0}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;font:500 13px/1.5 var(--mono);color:var(--muted)}
.fig{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font:500 11px/1.3 var(--mono);color:var(--muted);margin:8px 2px 0}
/* a long word in the title breaks inside the word in the Fig 1 caption too, so the Plan tab fits a 320 px screen */
.fig span{min-width:0;overflow-wrap:anywhere}
/* a step's view note sits under the 3D view; with no picture (still loading, or no 3D) it has nothing to tell */
.vnote{margin:8px 2px 0;font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.viewer:not([data-ready])+.vnote{display:none}

/* plan */
.phases{display:flex;flex-wrap:wrap;gap:12px 6px;margin:14px 0 6px}
.phase{min-width:min(5.5rem,100%)}
.phase .bar{height:10px;border-radius:5px;background:var(--faint);border:1px solid var(--line)}
.phase:nth-child(3n+2) .bar{background:color-mix(in srgb,var(--accent) 35%,var(--faint))}
.phase:nth-child(3n+3) .bar{background:color-mix(in srgb,var(--accent) 70%,var(--faint))}
.phase .nm{font:600 13px/1.3 var(--display);color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.phase .tm{font:400 11px/1.3 var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips button{padding:5px 6px;font-size:11px;min-height:28px;min-width:28px}
ul.plain{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
ul.plain li{display:flex;gap:8px;align-items:baseline;min-width:0}
ul.plain li>span:last-child{min-width:0;overflow-wrap:anywhere}
ul.plain li>.pill{flex:0 0 auto}

/* pills and badges */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11px/1.25 var(--mono);padding:5px 7px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--card);max-width:100%;overflow-wrap:anywhere}
.pill.ppe{border-color:var(--caution);color:var(--caution)}
.pill.part{border-color:var(--accent);color:var(--ink)}
.pill.part b{color:var(--accent)}
.est{font:500 11px/1 var(--mono);padding:2px 4px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}

/* build */
.build{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.build .stage{position:sticky;top:64px}
.jig[data-single] .build .stage{top:16px}
.rail{display:flex;gap:4px;overflow-x:auto;padding:4px 4px 10px;margin:-2px -4px 12px}
.rail button{min-width:38px;padding:8px 0;position:relative;flex:0 0 auto}
.rail button[data-done]::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:3px;background:var(--ok)}
.rail button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rail .sep{flex:0 0 1px;background:var(--line);margin:4px 3px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.alert{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;border-left:4px solid;color:var(--ink)}
.alert b{display:block;font:700 11px/1.4 var(--mono);letter-spacing:.1em}
.alert.warning{background:var(--warn-bg);border-color:var(--warn)}
.alert.warning b{color:var(--warn)}
.alert.caution{background:var(--caution-bg);border-color:var(--caution)}
.alert.caution b{color:var(--caution)}
ol.do{margin:14px 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:8px}
ol.do li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:15.5px;color:var(--ink)}
ol.do li::before{content:counter(n);font:700 12px/22px var(--mono);text-align:center;height:22px;border-radius:11px;background:var(--faint);color:var(--text)}
ol.do li.new{color:var(--text);counter-increment:none}
ol.do li.new::before{content:"+";background:none;border:1px dashed var(--control)}
details.tech{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--page)}
details.tech summary{cursor:pointer;padding:9px 12px;font:600 13px/1.3 var(--display);color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary::after{content:"How to";font:500 11px/1.5 var(--mono);color:var(--muted);text-transform:uppercase;white-space:nowrap}
details.tech[open] summary::after{content:"Close"}
details.tech summary .see{font:500 11px/1.5 var(--mono);color:var(--muted);margin-left:auto}
details.tech .in{padding:0 12px 10px}
details.tech ol{margin:4px 0;padding-left:20px;font-size:14px}
details.tech .tl{font-size:13px;color:var(--muted);margin:6px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;margin:14px 0 10px;background:var(--page)}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.why,.tip{font-size:14px;color:var(--text);margin:8px 0 0;padding-left:12px;border-left:2px solid var(--line)}
/* the step heading keeps its focus ring (2px + 2px offset) clear of the "Step n of N" line above it */
article.step .eyebrow+h2{margin-top:6px}
/* a long word in a step (an instruction, the check, a note, a card) breaks inside the word, so the card never runs past
   a 320 px screen; .check is a flex row, so its text also needs min-width 0 */
ol.do li,.check span,article.step .eyebrow,.why,.tip,.alert,details.tech{overflow-wrap:anywhere}
.check span{min-width:0}
.why b,.tip b{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px}
.empty{color:var(--muted);font-size:14px}

/* levels: First time sees all; Some experience hides first-time lines and "why"; Experienced also hides tips */
[data-level="some"] .only-new,[data-level="pro"] .only-new,[data-level="pro"] .not-pro{display:none}

/* shop */
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.trip h3{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.trip .note{font-size:13px;color:var(--muted);margin:4px 0 8px;overflow-wrap:anywhere}
.trip label{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--faint);font-size:14px;align-items:start}
.trip label small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.trip input{margin-top:3px}
.trip label:has(input:checked) .it{text-decoration:line-through;color:var(--muted)}
.trip .n{text-align:right;font:500 12px/1.4 var(--mono);white-space:nowrap}
.trip .n .pill{margin-top:3px}
.trip .sum{display:flex;justify-content:space-between;font:600 13px/1 var(--mono);padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--faint);vertical-align:top}
th{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
td small{color:var(--muted)}
tr.grp td{font:600 12px/1.3 var(--display);color:var(--ink);background:var(--page);padding-top:12px}
tfoot td{font-weight:600;color:var(--ink);border-bottom:0}
tfoot tr.total td{font-size:16px;border-top:2px solid var(--ink)}
tfoot td.inc{white-space:normal}
code.c{font:500 11px/1 var(--mono);color:var(--muted)}
.notes{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--text)}
.notes li{margin:4px 0}

/* cut list: wood fill is a light tint of the material colour, so the dark label always reads */
.cutplan h3{margin:18px 0 6px}
.board{margin:10px 0 16px}
.board .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font:500 12px/1.3 var(--mono);color:var(--muted);margin-bottom:4px}
.board svg{width:100%;height:auto;display:block}
.board .bar{position:relative;height:46px;border:1px dashed var(--muted);border-radius:3px;background:repeating-linear-gradient(45deg,var(--faint) 0 4px,var(--line) 4px 5.5px)}
.board .seg{position:absolute;top:3px;bottom:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border:1px solid #5c4a30;border-radius:2px;color:var(--wood-ink);font:700 13px/1.15 var(--mono)}
.board .seg small{font-weight:500;font-size:11px}
.board svg .wood{stroke:#5c4a30;stroke-width:1}
.board svg .waste{fill:url(#jig-hatch);stroke:var(--line)}
.board svg text{font:700 26px var(--mono);fill:var(--wood-ink)}
.board svg text.dim{font-weight:500;font-size:19px}
.board svg.sheet{max-width:440px}.board svg.sheet text{font-size:52px}.board svg.sheet text.dim{font-size:38px}
.board svg .stock{fill:none;stroke:var(--muted);stroke-dasharray:4 3}
.board .note{margin:6px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.defs{position:absolute;width:0;height:0}
/* print list: the settings cell wraps, a long word too */
.prints td.set{min-width:12ch;overflow-wrap:anywhere}

/* noscript copy */
.jig:empty{display:none}
.noscript{max-width:820px;margin:0 auto;padding:28px 16px}

/* print: every step once, in order, no 3D, light colours */
.print-only{display:none}
@media print{
:root:root:root{--page:#fff;--card:#fff;--ink:#000;--text:#1d1b18;--muted:#4a463f;--line:#999;--control:#777;--faint:#eee;--accent:#8f3609;--accent-ink:#fff;--warn:#8a1d13;--warn-bg:#fff;--caution:#5c3d00;--caution-bg:#fff;--ok:#1f5a2a;color-scheme:light}
.tabs,.top .level,.viewer,.vbar,.fig,.vnote,.rail,.build,.nav,.chips,[data-live]{display:none!important}
[data-panel]{display:block!important;margin-bottom:24px}
.print-only{display:block}
.grid2{display:block}
.card{break-inside:avoid;margin:12px 0}
.jig{padding:0}
details.tech summary::after,details.tech[open] summary::after{content:none}
/* fitBoq() measures the screen, not the paper: in print an item with a word of 20 letters or more may break in it */
.boq td[data-long]{overflow-wrap:anywhere}
}
.pm{display:none}
/* a long word in the summary or a trip item breaks rather than run under the amount or past the screen (the BOQ item
   too, on narrow screens, where its row is a grid; in a table it would shrink the column and break short words, so
   there app.js fitBoq() sets data-break only on the item cells that make the table scroll sideways) */
.lede,.trip label .it{overflow-wrap:anywhere}
.boq td[data-break]{overflow-wrap:anywhere}
/* the BOQ table: app.js fitBoq() sets data-fit only when the table would scroll sideways with no short word broken:
   "wrap" (Buy and Rate wrap at a space), then "stack" (each row is a grid, as on a phone) */
.boq[data-fit~="wrap"] tbody td:nth-child(4),.boq[data-fit~="wrap"] tbody td:nth-child(5){white-space:normal}
.boq[data-fit~="stack"] thead{display:none}
.boq[data-fit~="stack"],.boq[data-fit~="stack"] tbody,.boq[data-fit~="stack"] tfoot{display:block}
.boq[data-fit~="stack"] tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--faint)}
.boq[data-fit~="stack"] td{border:0;padding:0}
.boq[data-fit~="stack"] tbody td:nth-child(1){grid-row:1/4}
.boq[data-fit~="stack"] tbody td:nth-child(2){grid-column:2;grid-row:1;overflow-wrap:anywhere}
.boq[data-fit~="stack"] tbody td:nth-child(3){grid-column:2;grid-row:2}
.boq[data-fit~="stack"] tbody td:nth-child(4){grid-column:2;grid-row:3;text-align:left;font-family:inherit}
.boq[data-fit~="stack"] tbody td:nth-child(5){grid-column:3;grid-row:2;color:var(--muted)}
.boq[data-fit~="stack"] tbody td:nth-child(6){grid-column:3;grid-row:1;font-weight:600;color:var(--ink)}
.boq[data-fit~="stack"] td[data-l]::before{content:attr(data-l) ": ";color:var(--muted)}
.boq[data-fit~="stack"] tr.grp{display:block;padding:0;border:0}
.boq[data-fit~="stack"] tr.grp td{display:block;padding:10px 8px 6px}
.boq[data-fit~="stack"] tfoot tr{grid-template-columns:minmax(0,1fr) auto}
.boq[data-fit~="stack"] tfoot tr.total td{border-top:0;padding-top:4px}

<noscript><div class="noscript"><h1>Plywood storage cube</h1>
<p>A storage cube of 18 mm birch plywood, 400 mm on each side. You cut five parts with a jigsaw, join them with glue and screws, and nail on a thin back.</p>
<p>Size: 400 × 405 × 400 mm (width × height × depth). Time: 6 h 30 min of work and 4 h of waiting. Cost: €264.42, an estimate.</p>
<p>Level: First time.</p>
<p>Turn on JavaScript to see the 3D view, the level switch and the tick boxes.</p>
<h2>Plan</h2>
<ol><li>Prepare: steps 1, 2, 3, 3 h 10 min</li><li>Build: steps 4, 5, 6, 7, 2 h</li><li>Finish: steps 8, 9, 1 h 25 min + 4 h wait</li></ol>
<h3>Tools</h3>
<ul><li>Tape measure (you have it)</li><li>Pencil (you have it)</li><li>Try square, 300 mm (buy)</li><li>Straightedge, aluminium, 1000 mm (buy)</li><li>F-clamp, 300 mm × 2 (buy)</li><li>Two trestles (borrow)</li><li>Jigsaw, with a pendulum setting of 0 (borrow)</li><li>Jigsaw blades, clean cut for wood (T101B), pack of 5 (buy)</li><li>Cordless drill (you have it)</li><li>Drill bit set, 2.5 mm and 4 mm wood bits, countersink bit (buy)</li><li>Corner clamp, 90°, opens to 20 mm or more × 2 (buy)</li><li>Hammer, pin hammer or small claw hammer (you have it)</li><li>Sanding block (buy)</li><li>Synthetic brush, 50 mm, for water-based finish (buy)</li><li>Safety glasses, EN 166 (buy)</li><li>Ear protection (buy)</li><li>Dust mask, FFP2 (buy)</li><li>Nitrile gloves (buy)</li></ul>
<h2>Shopping list</h2>
<h3>1. Online order</h3>
<p>Order 3 days before you start.</p>
<ul><li>1 × pack of 5: Sandpaper, 120 grit, €3.49</li><li>1 × pack of 5: Sandpaper, 180 grit, €3.49</li><li>1 × pack of 5: Sandpaper, 240 grit, €3.49</li><li>1 × 0.375 L can: Water-based varnish, clear, matt, interior, €12.95</li><li>1 × pack of 10: Lint-free cloth, cotton, €3.99</li><li>1 × Nitrile gloves, €4.99</li><li>1 × pack of 16: Felt pad, 25 mm round, 5 mm thick, self-adhesive, €3.49</li></ul>
<h3>2. DIY store</h3>
<ul><li>1 × Safety glasses, EN 166, €4.99</li><li>1 × Ear protection, €7.99</li><li>1 × Try square, 300 mm, €9.99</li><li>1 × Straightedge, aluminium, 1000 mm, €12.99</li><li>2 × F-clamp, 300 mm, €17.98</li><li>1 × Jigsaw blades, clean cut for wood (T101B), pack of 5, €6.99</li><li>1 × Dust mask, FFP2, €5.99</li><li>1 × Sanding block, €3.99</li><li>1 × Drill bit set, 2.5 mm and 4 mm wood bits, countersink bit, €9.99</li><li>1 × box of 50: Wood screw, 4 × 40 mm, countersunk, €4.79</li><li>1 × 250 ml bottle: Wood glue, PVA, D3, €6.99</li><li>2 × Corner clamp, 90°, opens to 20 mm or more, €19.98</li><li>1 × box of 200: Panel pin, 1.6 × 25 mm, steel, €2.49</li><li>1 × Synthetic brush, 50 mm, for water-based finish, €5.49</li></ul>
<h3>3. Timber merchant</h3>
<p>Ask for birch plywood, grade BB/BB. Look at the two faces before you buy a sheet.</p>
<ul><li>2 × sheet: Birch plywood 18 mm, grade BB/BB, 1220 × 610 mm, €69.90</li><li>1 × sheet: Birch plywood 6 mm, grade BB/BB, 1220 × 610 mm, €13.95</li></ul>
<h3>4. Borrow</h3>
<p>Ask a friend, a neighbour or a tool library.</p>
<ul><li>Two trestles</li><li>Jigsaw</li></ul>
<p>Total: €264.42, with 10% contingency.</p>
<h2>Steps</h2>
<ol>
<li><h3>Cut the parts</h3>
<p><strong>WARNING:</strong> Wear safety glasses. The jigsaw can throw chips into your eyes.</p>
<p><strong>WARNING:</strong> Wear ear protection. A loud jigsaw can hurt your ears.</p>
<p><strong>WARNING:</strong> Keep your hands away from the area under the sheet. The blade comes out below the sheet.</p>
<p><strong>WARNING:</strong> Unplug the jigsaw before you change the blade. A saw that starts can cut you.</p>
<p><strong>CAUTION:</strong> Put the sheet on the trestles with the good face down. The jigsaw splits the top face.</p>
<ol><li>Put the 18 mm sheet on the two trestles with the good face down.</li><li>Mark each part from the cut list on the top face.</li><li>Measure each line two times before you cut. (first time)</li><li>Cut across the sheet first, at the end of each part.</li><li>Cut each piece to a width of 394 mm.</li><li>Cut back D from the 6 mm sheet the same way.</li><li>Write the part letter on the top face of each part.</li></ol>
<p><strong>Check:</strong> Make sure that you have two parts A and one each of parts B, C and D.</p>
<p><strong>Why:</strong> A jigsaw cuts on the up stroke, so the bottom face stays clean. The face with the letter goes on the inside of the cube.</p>
<p><strong>Tip:</strong> Keep the offcuts. They make good scrap blocks for the clamps and the drill.</p>
</li>
<li><h3>Sand the parts</h3>
<p><strong>WARNING:</strong> Wear a dust mask. Fine dust can hurt your lungs.</p>
<p><strong>CAUTION:</strong> Do not sand across the grain. Cross scratches show through the finish.</p>
<ol><li>Sand each cut edge to the line with 120 grit.</li><li>Sand the faces of each part with 120 grit.</li><li>Sand each sharp edge to a 1 mm round.</li><li>Sand all faces and edges again with 180 grit.</li><li>Remove the dust with a dry cloth.</li></ol>
<p><strong>Check:</strong> Make sure that the edges are straight and that no splinters show on the faces.</p>
<p><strong>Why:</strong> Plywood edges show the plies. A smooth, round edge looks clean and does not splinter.</p>
<p><strong>Tip:</strong> Keep the block flat on the edge. A tilted block makes the edge uneven.</p>
</li>
<li><h3>Drill the sides</h3>
<p><strong>CAUTION:</strong> Put a scrap block under the side. The bit can split the face when it comes out.</p>
<p><strong>WARNING:</strong> Wear safety glasses. The drill bit can throw chips into your eyes.</p>
<ol><li>Put the two sides A on the bench with the letters down.</li><li>Draw a line 9 mm from each short edge of each side.</li><li>Mark three holes on each line, at 40, 197 and 354 mm from a long edge.</li><li>Drill a 4 mm hole through the side at each mark.</li><li>Countersink each hole on the top face.</li></ol>
<p><strong>Check:</strong> Make sure that each side has six holes, 9 mm from the short edges.</p>
<p><strong>Why:</strong> The line at 9 mm is the center of the 18 mm edge of the top and the bottom. Each screw then goes into the middle of the edge.</p>
</li>
<li><h3>Attach the bottom to a side</h3>
<p><strong>CAUTION:</strong> Drill a pilot hole before you install each screw. A screw with no pilot hole splits the plies.</p>
<p><strong>WARNING:</strong> Wear safety glasses. The drill bit can throw chips into your eyes.</p>
<ol><li>Put bottom B flat on the bench with the letter up. (first time)</li><li>Apply glue to one 394 mm edge of bottom B.</li><li>Put a side A against the glued edge, with its letter on the inside.</li><li>Align the holes in the side with the center of the edge.</li><li>Clamp the corner with the two corner clamps.</li><li>Drill a 2.5 mm pilot hole 25 mm into the edge through each hole.</li><li>Install three 40 mm screws through the side into the bottom.</li></ol>
<p><strong>Check:</strong> Make sure that the front edges of the side and the bottom are flush.</p>
<p><strong>Why:</strong> The glue makes the joint strong. The screws pull the joint tight while the glue dries.</p>
</li>
<li><h3>Attach the top to the side</h3>
<p><strong>WARNING:</strong> When you drill, wear safety glasses. The bit can throw chips into your eyes.</p>
<p><strong>CAUTION:</strong> Drill a pilot hole before you install each screw. A screw with no pilot hole splits the plies.</p>
<ol><li>Turn the assembly upside down on the bench.</li><li>Apply glue to one 394 mm edge of top C.</li><li>Put top C flat on the bench with the letter up and the glued edge against side A.</li><li>Clamp the corner with the two corner clamps.</li><li>Drill a 2.5 mm pilot hole 25 mm into the edge through each hole.</li><li>Install three 40 mm screws through the side into the top.</li></ol>
<p><strong>Check:</strong> Make sure that the gap between the top and the bottom is 364 mm at the front and the back.</p>
</li>
<li><h3>Attach the second side</h3>
<p><strong>WARNING:</strong> When you drill, wear safety glasses. The bit can throw chips into your eyes.</p>
<p><strong>CAUTION:</strong> Drill a pilot hole before you install each screw. A screw with no pilot hole splits the plies.</p>
<ol><li>Put the assembly on the bench with side A down.</li><li>Apply glue to the free edges of the top and the bottom.</li><li>Put the second side A on the glued edges, with its letter on the inside.</li><li>Align the holes with the centers of the edges.</li><li>Drill a 2.5 mm pilot hole 25 mm into the edge through each hole.</li><li>Install six 40 mm screws through the side.</li></ol>
<p><strong>Check:</strong> Make sure that the front edges of the two sides, the top and the bottom are flush.</p>
<p><strong>Tip:</strong> The weight of the side holds the joint, so you do not need the clamps.</p>
</li>
<li><h3>Attach the back</h3>
<p><strong>WARNING:</strong> Wear safety glasses. A pin can fly out of the wood when you hit it.</p>
<ol><li>Put the cube on the bench with the front down.</li><li>Square the cube with the two diagonals.</li><li>Apply a thin line of glue to the back edges of the cube.</li><li>Put back D on the cube with the letter down and its edges flush with the outer faces.</li><li>Draw a line on back D, 9 mm from each edge.</li><li>Nail the back along the lines with 14 panel pins, about 100 mm apart.</li></ol>
<p><strong>Check:</strong> Make sure that no pin comes out of an inner or outer face of the cube.</p>
<p><strong>Why:</strong> The back holds the cube square. The lines put each pin in the center of an 18 mm edge.</p>
</li>
<li><h3>Apply the finish</h3>
<p><strong>WARNING:</strong> Open a window or work outdoors. Finish fumes in a closed room can give you a headache.</p>
<p><strong>WARNING:</strong> Wear gloves. The finish can irritate your skin.</p>
<p><strong>CAUTION:</strong> Do not shake the can. Air bubbles from the can stay in the dry finish.</p>
<ol><li>Remove the dust from all faces with a damp cloth.</li><li>Brush the first coat on all faces, inside and outside.</li><li>Wait 2 hours.</li><li>Sand all faces lightly with 240 grit.</li><li>Remove the dust with a damp cloth.</li><li>Brush the second coat.</li></ol>
<p><strong>Check:</strong> Make sure that the finish is dry and smooth before you put items in the cube.</p>
<p><strong>Why:</strong> Water lifts the wood fibres in the first coat. The light sand removes them, so the second coat is smooth.</p>
</li>
<li><h3>Attach the felt pads</h3>
<ol><li>Put the cube upside down on a soft cloth.</li><li>Clean each corner of the bottom with a dry cloth.</li><li>Remove the paper from a felt pad.</li><li>Press the pad on a corner, 5 mm from each outer edge.</li><li>Attach the other three pads the same way.</li></ol>
<p><strong>Check:</strong> Make sure that the cube stands flat on the floor and does not rock.</p>
<p><strong>Why:</strong> The pads keep the cube off the floor. They stop scratches on the floor and on the finish.</p>
</li>
</ol></div></noscript>

<script type="module">
const { createViewer } = (() => {
// The 3D step viewer. No static import: createViewer() loads three.js with import() and, on failure, writes the
// reason into the viewer slot. Parts already built are plain, the parts of this step are lit and arrive along their
// path, parts still to come are hidden (or ghosted). Units are millimetres, y is up. One WebGL renderer is shared:
// only the viewer on screen owns the canvas.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const CAPTURE = /[?&]capture\b/.test(location.search); // keep the drawing buffer only for screen captures
const MSG = {
  webgl: "3D needs WebGL. The steps still work without it.",
  network: "3D needs a network connection. The steps still work without it.",
};
const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const isVec = (v) => Array.isArray(v) && v.length === 3 && v.every((x) => typeof x === "number" && Number.isFinite(x));
let THREE = null, Orbit = null, loading = null, shared = null;

// WebGL first (a test canvas), then the two modules. Each failure carries its reason.
function hasWebGL() {

    if (!hasWebGL()) throw Object.assign(new Error("WebGL is not available"), { reason: "webgl" });

      THREE = t;
      Orbit = o.OrbitControls;
    } catch (e) { throw Object.assign(new Error(e?.message ?? String(e)), { reason: "network" }); }

}

function fail(host, err) {
  const p = document.createElement("p");
  p.className = "vmsg";
  p.textContent = err?.reason ? MSG[err.reason] : `3D error: ${err?.message ?? err}. The steps still work without it.`;
  host.replaceChildren(p);
  host.dataset.state = err?.reason ?? "error";
  if (!err?.reason) console.warn("jig 3D:", err);

// One renderer for the page. The canvas moves to the viewer that is on screen.
function renderer() {
  if (shared) return shared;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: CAPTURE });
  r.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  const c = r.domElement;
  c.tabIndex = 0;
  c.setAttribute("role", "img");
  c.addEventListener("keydown", (e) => { if (shared.owner?.key(e)) { e.preventDefault(); e.stopPropagation(); } });
  return (shared = { r, canvas: c, owner: null });
}

// createViewer(host, data, { mode: "hero" | "steps", label, onSpin }) -> viewer API, or null when 3D cannot run.
async function createViewer(host, data, opts = {}) {
  try { await load3d(); } catch (e) { fail(host, e); return null; }
  try { return build(host, data, opts); } catch (e) { fail(host, e); return null; }
}

function build(host, data, { mode = "steps", label = "3D view", onSpin } = {}) {
  const T = THREE, hero = mode === "hero", R = renderer(), canvas = R.canvas;
  const box = host.querySelector("[data-canvas]"), layer = host.querySelector("[data-tags]");
  const UP = new T.Vector3(0, 1, 0), V = (a) => new T.Vector3(...a), RAD = Math.PI / 180;
  const small = Math.min(screen.width || 1e4, screen.height || 1e4) < 700;
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(30, 1.6, 10, 60000);
  const controls = new Orbit(camera, canvas);
  canvas.style.touchAction = ""; // OrbitControls sets none; the CSS gives pan-y until a tap turns on orbit
  controls.enabled = false;
  controls.enableDamping = true;
  controls.autoRotateSpeed = 0.7;
  controls.maxPolarAngle = Math.PI * 0.495;

  // ---- theme tokens
  const tok = {};
  const readTokens = () => {
    const cs = getComputedStyle(host);
    for (const k of ["ink", "accent", "grid"]) tok[k] = cs.getPropertyValue(`--v-${k}`).trim() || "#888888";
    const shade = parseFloat(cs.getPropertyValue("--v-prop")); // props (a white wall) are dimmed in the dark theme
    tok.prop = shade > 0 && shade <= 1 ? shade : 1;
  };
  readTokens();

  // ---- lights and floor
  const hemi = new T.HemisphereLight(0xffffff, 0x8a7f72, 2.1);
  const sun = new T.DirectionalLight(0xffffff, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  sun.shadow.bias = -0.0004;
  scene.add(hemi, sun, sun.target);
  const floor = new T.Mesh(new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new T.ShadowMaterial({ opacity: 0.18 }));
  floor.receiveShadow = true;
  scene.add(floor);

  // ---- shapes: a box, or a cylinder along the side that is not one of the two equal sides
  const axisOf = ([x, y, z]) => { const eq = (a, b) => Math.abs(a - b) < 1e-6; return eq(x, z) ? 1 : eq(x, y) ? 2 : eq(y, z) ? 0 : -1; };
  function shape(kind, size) {
    const axis = kind === "cylinder" ? axisOf(size) : -1;
    if (axis < 0) return new T.BoxGeometry(...size);
    const r = size[(axis + 1) % 3] / 2, g = new T.CylinderGeometry(r, r, size[axis], 28);
    if (axis === 0) g.rotateZ(Math.PI / 2);
    if (axis === 2) g.rotateX(Math.PI / 2);
    return g;
  }
  function solid(g, mat, edge) {
    const m = new T.Mesh(g, mat);
    m.castShadow = m.receiveShadow = true;
    if (edge) m.add(new T.LineSegments(new T.EdgesGeometry(g, 30), edge));
    return m;
  }
  // rotate [rx, ry, rz] degrees about the box centre, x then y then z (R = Rz Ry Rx, as geometry.mjs)
  const turn = (m, r) => { if (isVec(r)) m.rotation.set(r[0] * RAD, r[1] * RAD, r[2] * RAD, "ZYX"); };

  // ---- parts: an assembled mesh and a flat "kit" mesh share one material per part
  for (const p of data.parts) if (!isVec(p.at) || !isVec(p.size)) throw new Error(`part ${p.id} has no position ("at") or size`);
  const parts = data.parts.map((p, i) => {
    const size = V(p.size), center = V(p.at).addScaledVector(size, 0.5);
    const base = new T.Color(p.color || "#cfc6b8");
    base.offsetHSL(0, 0, (((i * 37) % 7) - 3) * 0.008); // a little variation, like real boards
    const mat = new T.MeshLambertMaterial({ color: base.clone() }), edge = new T.LineBasicMaterial({ color: tok.ink, transparent: true });
    const mesh = solid(shape(p.shape, p.size), mat, edge);
    mesh.position.copy(center);
    turn(mesh, p.rotate);
    mesh.updateMatrixWorld();
    const wb = new T.Box3().setFromObject(mesh);
    const flat = [...p.size].sort((a, b) => b - a), round = p.shape === "cylinder" && axisOf(p.size) >= 0;
    const kitSize = round ? [p.size[axisOf(p.size)], p.size[(axisOf(p.size) + 1) % 3], p.size[(axisOf(p.size) + 1) % 3]] : [flat[0], flat[2], flat[1]];
    const kit = p.kind === "each" ? null : solid(shape(p.shape, kitSize), mat, edge); // bought parts are not cut; printed parts lie in the kit too
    return { ...p, i, center, base, mat, edge, mesh, kit, kitSize, round, offset: new T.Vector3(), fly: new T.Vector3(), state: "hidden", wb };
  });
  const assembly = new T.Group(), kitGroup = new T.Group();
  parts.forEach((p) => { assembly.add(p.mesh); if (p.kit) kitGroup.add(p.kit); });
  scene.add(assembly, kitGroup);

  // ---- props (wall, bench): context only, never in the bill
  const props = Object.entries(data.props || {}).filter(([, pr]) => isVec(pr.at) && isVec(pr.size)).map(([id, pr]) => {
    const base = new T.Color(pr.color || "#e6e1d8"), m = solid(shape(pr.shape, pr.size), new T.MeshLambertMaterial({ color: base.clone().multiplyScalar(tok.prop) }), null);
    m.position.copy(V(pr.at).addScaledVector(V(pr.size), 0.5));
    turn(m, pr.rotate);
    m.castShadow = false;
    m.visible = false;
    scene.add(m);
    m.updateMatrixWorld(true);
    // props never move: their world box (0.5 mm inside, so a part that only touches one is not in it) stops "Apart"
    return { id, m, base, hero: pr.hero !== false, box: new T.Box3().setFromObject(m).expandByScalar(-0.5) };
  });

  // the camera frames the parts. A repair has no parts: the object that is there (the props of the Plan view) sets it.
  const bounds = new T.Box3();
  parts.forEach((p) => bounds.union(p.wb));
  if (bounds.isEmpty()) props.filter((pr) => pr.hero).forEach((pr) => bounds.union(new T.Box3().setFromObject(pr.m)));
  if (bounds.isEmpty()) bounds.set(new T.Vector3(-100, 0, -100), new T.Vector3(100, 200, 100));
  const modelCenter = bounds.getCenter(new T.Vector3()), modelSize = Math.max(1, bounds.getSize(new T.Vector3()).length());
  controls.minDistance = Math.max(10, modelSize * 0.03); // close enough for a zoomed step on a bracket
  controls.maxDistance = Math.max(2000, modelSize * 8);

  // kit layout: rows on the floor, centred under the assembly. Bounds come from the kit meshes only (all visible).
  const kitBox = new T.Box3();
  {
    const cut = parts.filter((p) => p.kit).sort((a, b) => b.kitSize[0] - a.kitSize[0]);
    const rowMax = Math.max(1600, modelSize * 0.9, ...cut.map((p) => p.kitSize[0])), gap = Math.max(20, modelSize * 0.04);
    let x = 0, z = 0, rowDepth = 0;
    for (const p of cut) {
      if (x > 0 && x + p.kitSize[0] > rowMax) { x = 0; z += rowDepth + gap; rowDepth = 0; }
      p.kit.position.set(x + p.kitSize[0] / 2, p.kitSize[1] / 2, z + p.kitSize[2] / 2);
      kitBox.union(new T.Box3().setFromCenterAndSize(p.kit.position, V(p.kitSize)));
      x += p.kitSize[0] + gap;
      rowDepth = Math.max(rowDepth, p.kitSize[2]);
    }
    if (!kitBox.isEmpty()) {
      const kc = kitBox.getCenter(new T.Vector3());
      kitGroup.position.set(modelCenter.x - kc.x, 0, modelCenter.z - kc.z);
      kitBox.translate(kitGroup.position);
    }
  }

  // ---- fasteners: one InstancedMesh pair (shaft + head) per type; head at `at`, the shaft runs along `dir`
  const HEADS = {
    flat: (d) => new T.CylinderGeometry(d, d * 0.5, d * 0.6, 16).translate(0, -d * 0.2, 0),
    pan: (d) => new T.CylinderGeometry(d * 0.8, d * 0.95, d * 0.6, 16).translate(0, d * 0.3, 0),
    hex: (d) => new T.CylinderGeometry(d * 0.95, d * 0.95, d * 0.7, 6).translate(0, d * 0.35, 0),

    if (!isVec(f.dir) || !f.dir.some((v) => v !== 0)) throw new Error(`fastener ${fi + 1} of step ${si + 1} has no direction ("dir")`);
    const len = f.len > 0 ? f.len : 30, d = f.d > 0 ? f.d : 4, head = Object.hasOwn(HEADS, f.head ?? "") ? f.head : "flat";
    const key = `${len}|${d}|${head}|${f.color || ""}`;
    if (!types.has(key)) types.set(key, { len, d, head, base: new T.Color(f.color || "#8f959c"), list: [] });
    const t = types.get(key), dir = V(f.dir).normalize();
    const item = { step: si, t, k: t.list.length, home: V(f.at), dir, len, q: new T.Quaternion().setFromUnitVectors(UP, dir.clone().negate()), state: "hidden" };
    t.list.push(item);
    fast.push(item);
  }));
  for (const t of types.values()) {
    const mat = new T.MeshLambertMaterial({ color: 0xffffff });
    t.meshes = [new T.CylinderGeometry(t.d / 2, t.d * 0.3, t.len, 10).translate(0, -t.len / 2, 0), HEADS[t.head](t.d)].map((g) => {
      const m = new T.InstancedMesh(g, mat, t.list.length);
      m.castShadow = true;
      m.frustumCulled = false;
      for (let k = 0; k < t.list.length; k++) m.setColorAt(k, t.base);
      scene.add(m);
      return m;
    });
  }
  // A fastener moves with its host when the parts move apart: the part its shank enters first, just past the head
  // (installed by its step; the smallest box when parts overlap). With no host it hides while the parts are apart.
  const volume = (b) => { const s = b.getSize(new T.Vector3()); return s.x * s.y * s.z; };
  for (const f of fast) {
    const into = f.home.clone().addScaledVector(f.dir, Math.min(1.5, f.len / 2)), all = parts.filter((p) => p.wb.containsPoint(into));
    const built = all.filter((p) => (typeof p.step === "number" ? p.step : Infinity) <= f.step);
    f.host = (built.length ? built : all).sort((a, b) => volume(a.wb) - volume(b.wb))[0] ?? null;
  }
  const M4 = new T.Matrix4(), P3 = new T.Vector3(), Q = new T.Quaternion(), SPIN = new T.Quaternion(), ONE = new T.Vector3(1, 1, 1), ZERO = new T.Vector3(0, 0, 0), C = new T.Color();
  // want: the state asks for it; visible: it is drawn (want, and a host or the parts together)
  function placeF(f, want, away = 0, spin = 0) {
    Object.assign(f, { want, away, spin });
    const visible = want && (Boolean(f.host) || !explode);
    P3.copy(f.home).addScaledVector(f.dir, -f.len * 1.6 * away);
    if (f.host) P3.add(f.host.offset);
    Q.copy(f.q).multiply(SPIN.setFromAxisAngle(UP, spin));
    M4.compose(P3, Q, visible ? ONE : ZERO);
    for (const m of f.t.meshes) { m.setMatrixAt(f.k, M4); m.instanceMatrix.needsUpdate = true; }
    f.visible = visible;
  }
  function colorF(f, lit) {
    C.copy(f.t.base);
    if (lit) C.lerp(new T.Color(tok.accent), 0.65);
    for (const m of f.t.meshes) { m.setColorAt(f.k, C); m.instanceColor.needsUpdate = true; }
  }

  // ---- frame the floor, grid and sun to the scene
  let grid;

// ---------- formats (the same rules as engine/lib/locale.mjs, which the browser cannot import)
const U = D.meta.units === "in" ? "in" : "mm", CUR = D.meta.currency || "USD";

// Money decimals come from the fixed table of locale.mjs minorUnits() (tests/page.test.mjs compares the two), not from
// the browser's ICU data, so the page shows the same amounts as plan.md and the CLI. Other codes give 2.
const DIGITS = Object.fromEntries([..."AFN ALL BIF CLP COP DJF GNF HUF IDR IQD IRR ISK JPY KMF KPW KRW LAK LBP MGA MMK PKR PYG RWF SLL SOS SYP UGX VND VUV XAF XOF XPF YER".split(" ").map((c) => [c, 0]), ..."BHD JOD KWD LYD OMR TND".split(" ").map((c) => [c, 3])]);

const MF = (() => { try { return new Intl.NumberFormat("en-US", { style: "currency", currency: CUR, minimumFractionDigits: DEC, maximumFractionDigits: DEC }); } catch { return null; } })();
const money = (n) => (typeof n !== "number" || !Number.isFinite(n) ? "price?" : MF ? MF.format(round(n, DEC)) : `${CUR} ${round(n, DEC).toFixed(DEC)}`);

// plural: the rule of engine/lib/util.mjs plural() (tests/page.test.mjs compares the two). A word of one or two letters
// ("L"), an abbreviation ("gal", "pcs.") or a word with no vowel ("qt", "m²") stays as it is. A unit of more words
// changes the noun before "of" ("2 pairs of gloves"), else its last word ("16 shelf pins", "3 board feet"), unless
// that word stays ("5.5 cu ft", "2 fl oz"). A note in brackets at the end stays as it is: "3 tins (small)".
const ABBREV = new Set("ea pc pcs in ft yd mi mm cm m km ml cl dl l g kg mg oz lb lbs gal qt pt fl cu sq tsp tbsp doz".split(" "));
const fixed = (x) => /^[a-z]{0,2}$/i.test(x) || /\.$/.test(x) || ABBREV.has(x.toLowerCase()) || !/[aeiouy]/i.test(x);

// An amount a step uses, as util.mjs amount(): 2 decimals, but a small positive amount keeps 2 significant digits (0.004 L).

// ---------- model lookups and reader state
const N = D.steps.length, T = D.totals;
const TOOL = new Map(D.tools.map((t) => [t.id, t])), ROW = new Map(D.boq.map((r) => [r.key, r]));
const KIT = new Set(D.boq.filter((r) => r.get === "kit").map((r) => r.id)); // materials that come in the kit (included)
const mat = (id) => (D.materials && Object.hasOwn(D.materials, id) ? D.materials[id] : { name: id, spec: "", unit: "" });
const FIRST = new Map(); // technique id -> first step that teaches it
D.steps.forEach((s, i) => (s.teach ?? []).forEach((id) => FIRST.has(id) || FIRST.set(id, i)));
const LEVELS = [["new", "First time"], ["some", "Some experience"], ["pro", "Experienced"]], LV = LEVELS.map((l) => l[0]);
// The cut tab is "Cut list", "Print list" (3D-printed parts only) or "Cut and print". A project with nothing to cut or

const CUTS = D.parts.some((p) => p.kind !== "each" && p.kind !== "printed"), PRINTS = D.parts.some((p) => p.kind === "printed");
const NAMES = { plan: "Plan", shop: "Shop", cut: PRINTS ? (CUTS ? "Cut and print" : "Print list") : "Cut list", build: "Build" };
let TABS = String(root.dataset.tabs || "").split(",").filter((t) => Object.hasOwn(NAMES, t));

// Hash routes: #plan, #shop, #cut, #build/<n>. A bad step number falls back to step 1.
function route() {
  let t = "", n;
  try { [t = "", n] = decodeURIComponent(location.hash.slice(1)).split("/"); } catch {}
  return { tab: TABS.includes(t) ? t : null, step: t === "build" && n !== undefined ? (/^\d{1,6}$/.test(n) ? Number(n) - 1 : 0) : null };
}

// Overall size from the part boxes (rotated about their centres, x then y then z). Wall fixings (role anchor) are
// not part of the object's size unless every part is one. A repair with no placed part measures the object that is
// there: the props of the Plan view (hero), as the 3D view frames them.
function sizeOf() {
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity], R = Math.PI / 180;
  const body = D.parts.filter((p) => p.role !== "anchor"), placed = (list) => list.filter((p) => isVec(p.at) && isVec(p.size));
  let list = placed(body.length ? body : D.parts);
  if (!list.length) list = placed(Object.values(D.props ?? {}).filter((p) => p && p.hero !== false));
  for (const p of list) {
    const hs = p.size.map((s) => s / 2), c = p.at.map((a, i) => a + hs[i]);
    let e = hs;
    if (isVec(p.rotate) && p.rotate.some((d) => d % 360)) {
      const [cx, sx, cy, sy, cz, sz] = [0, 0, 1, 1, 2, 2].map((a, i) => (i % 2 ? Math.sin : Math.cos)(p.rotate[a] * R));

  }

// ---------- Shop: trips first, then the full bill of quantities
function shopText() {

    });
    return h`<div class="card trip">
      <h3><span>${ti + 1}. ${t.name}</span><span class="eyebrow">${borrow ? "ask" : t.online ? (t.lead > 0 ? `delivery in ${plural(t.lead, "day")}` : "online") : "trip"}</span></h3>
      ${(when || t.note) && h`<p class="note">${[when, t.note].filter(Boolean).join(" ")}</p>`}
      ${site && h`<p class="note"><a href="${t.url}" target="_blank" rel="noopener noreferrer">${site}</a></p>`}
      ${items}

  });

    ${D.boq.length > 0 && h`<div class="card">

// ---------- Cut list: each board and sheet to scale, filled with a light tint of the material colour
const tint = (hex) => {
  const m = /^#([0-9a-f]{6})$/i.exec(hex ?? "") ?? [null, "d9b88a"], v = parseInt(m[1], 16);
  return `#${[16, 8, 0].map((s) => Math.round(((v >> s) & 255) * 0.45 + 255 * 0.55).toString(16).padStart(2, "0")).join("")}`;
};
// A piece with no letter in its drawing is named in one line under the board or sheet: "Too small to show a letter:
// 2 × F (964 × 70 mm)." So the tab names every piece, on a phone too.
const unlettered = (list) => list.length > 0 && h`<p class="note">Too small to show a letter: ${group(list, (x) => `${x.label}\n${x.size}`)
  .map(([, g]) => `${g.length > 1 ? `${g.length} × ` : ""}${g[0].label} (${g[0].size})`).join(", ")}.</p>`;
function cutText() {
  const W = 1000, kerf = D.meta.kerf, trim = D.meta.trim;
  // two materials with one name ("Birch plywood", 18 mm and 6 mm): the heading adds the spec, so each drawing has its own
  const heading = (c) => { const spec = D.cuts.filter((x) => x.name === c.name).length > 1 ? mat(c.material).spec : ""; return h`<h3>${c.name}${spec ? `, ${spec}` : ""}</h3>`; };
  const drawings = D.cuts.map((c) => {
    const fill = tint(c.color);
    // A board is an HTML bar, so its labels keep their size on a phone. A label shows only when it fits at 330 px.
    if (c.kind === "linear") return h`${heading(c)}${c.boards.map((b, bi) => {
      const L = b.stock.length, fits = (f, s) => f * 330 >= String(s).length * 7.5 + 6, at = (v) => `${round((v / L) * 100, 3)}%`, small = [];
      const segs = b.cuts.map((x) => {
        const f = x.len / L, label = len(x.len, false);
        if (!fits(f, x.label)) small.push({ label: x.label, size: len(x.len) });
        return h`<span class="seg" style="left:${at(x.at)};width:${at(x.len)};background:${fill}" title="${x.label} (${x.id}): ${len(x.len)}">${fits(f, x.label) && h`<b>${x.label}</b>`}${fits(f, label) && h`<small>${label}</small>`}</span>`;
      });
      return h`<div class="board"><div class="t"><span>Board ${bi + 1} of ${c.boards.length} · buy ${len(L)} · ${money(b.stock.price)}</span><span>waste ${len(b.waste)}</span></div>
        <div class="bar" role="img" aria-label="Board ${bi + 1}: ${b.cuts.map((x) => `${x.label} ${len(x.len)}`).join(", ")}">${segs}</div>${unlettered(small)}</div>`;
    })}`;
    return h`${heading(c)}${c.sheets.map((s, si) => {
      const k = W / s.stock.w, H = num(s.stock.h * k), small = [];
      const segs = s.cuts.map((x) => {
        const label = `${len(x.w, false)} × ${len(x.h, false)}`, cw = x.w * k, ch = x.h * k, cx = x.x * k + cw / 2, cy = x.y * k + ch / 2;
        // the letter fits the piece (52 units at most, 26 at least): across it, or up a tall piece when that gives a
        // larger letter. With room for the size too, the letter stands above the size.
        const fit = (a, b) => Math.min(52, 0.8 * b, (a - 6) / (0.62 * String(x.label).length)), flat = fit(cw, ch), up = fit(ch, cw);
        const turn = ch > cw && up > flat, fs = turn ? up : flat, dim = !turn && fs >= 52 && cw >= label.length * 24 + 10 && ch >= 110;
        if (fs < 26) small.push({ label: x.label, size: `${len(x.w, false)} × ${len(x.h)}` });
        const letter = dim ? h`<text x="${num(cx)}" y="${num(cy)}" text-anchor="middle">${x.label}</text>`
          : fs >= 26 && h`<text x="${num(cx)}" y="${num(cy)}" text-anchor="middle" dominant-baseline="central" style="font-size:${num(fs)}px"${turn ? h` transform="rotate(-90 ${num(cx)} ${num(cy)})"` : ""}>${x.label}</text>`;
        return h`<rect class="wood" fill="${fill}" x="${num(x.x * k)}" y="${num(x.y * k)}" width="${num(cw)}" height="${num(ch)}"><title>${x.label} (${x.id}): ${len(x.w, false)} × ${len(x.h)}</title></rect>${letter}${dim && h`<text class="dim" x="${num(cx)}" y="${num(cy + 46)}" text-anchor="middle">${label}</text>`}`;
      });
      return h`<div class="board"><div class="t"><span>Sheet ${si + 1} of ${c.sheets.length} · buy ${len(s.stock.w, false)} × ${len(s.stock.h, false)} ${U} · ${money(s.stock.price)}</span></div>
        <svg class="sheet" viewBox="-1 -1 ${W + 2} ${num(H + 2)}" role="img" aria-label="Sheet ${si + 1}: ${s.cuts.map((x) => `${x.label} ${len(x.w, false)} × ${len(x.h)}`).join(", ")}"><rect class="waste" width="${W}" height="${H}"/><rect class="stock" width="${W}" height="${H}"/>${segs}</svg>${unlettered(small)}</div>`;
    })}`;
  });
  // A cut size wraps only after a "×" on a phone: a mixed fraction ("35 5/16") keeps a no-break space.
  const size = (p) => (p.cut ? (p.cut.length !== undefined ? [p.cut.length, p.cut.width, p.cut.thick] : [p.cut.a, p.cut.b, p.cut.thick]).map((v) => len(v, false).replace(/ /g, "\u00a0")).join("\u00a0× ")
    : p.kind === "each" ? (KIT.has(p.material) ? "in the kit" : "bought") : "?");
  // printed parts have their own table (printList), so the Parts table holds the cut and the bought parts
  const others = D.parts.filter((p) => p.kind !== "printed");
  const rows = group(others, (p) => p.label).map(([label, list]) => h`<tr><td><span class="pill part"><b>${label}</b></span></td><td>${list[0].name}<small class="pm">${list[0].materialName}</small></td><td class="n">${list.length}</td><td class="n">${size(list[0])}</td><td class="pmat">${list[0].materialName}</td></tr>`);
  const plan = h`<div class="card cutplan"><h2>Cut plan</h2>
    <p class="lede sm">Each saw cut removes ${fine(kerf)}. The plan includes it.${trim > 0 ? ` Cut ${fine(trim)} from the start of each board to square the end.` : ""} Cut the longest parts first.</p>
    ${D.cuts.length ? drawings : h`<p class="empty">Nothing to cut.</p>`}</div>`;
  const parts = others.length > 0 && h`<div class="card"><h2>Parts</h2><div class="scroll"><table class="parts"><thead><tr><th>Part</th><th>Name</th><th class="n">Qty</th><th class="n">Cut size (${U})</th><th class="pmat">Material</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const defs = h`<svg class="defs" aria-hidden="true" focusable="false"><defs><pattern id="jig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--faint)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="2"/></pattern></defs></svg>`;
  if (!PRINTS) return h`${defs}
  <div class="grid2">${plan}
    ${parts}</div>`;
  // Cut and print: the cut plan and the parts side by side, the print list under them. Print list only: the print list
  // beside the bought parts, or alone.
  return CUTS ? h`${defs}<div class="stack"><div class="grid2">${plan}${parts}</div>${printList()}</div>` : parts ? h`<div class="grid2">${printList()}${parts}</div>` : printList();
}

// The printed parts by material, as markdown.mjs printList: grams and hours for one part (est: an estimate from the
// part size), and for each material the totals and the spools to buy (its BOQ row).
function printList() {
  const mark = (on) => on && h` <span class="est" title="An estimate from the part size">est</span>`;
  const mats = group(D.parts.filter((p) => p.kind === "printed" && p.print), (p) => p.material);
  const rows = mats.flatMap(([, list]) => group(list, (p) => p.label).map(([label, same]) => {

    return h`<tr><td><span class="pill part"><b>${label}</b></span></td><td>${p.name}</td><td class="n" data-l="Qty">${same.length}</td><td class="n" data-l="Grams each">${q.grams} g${mark(q.est?.grams)}</td>
      <td class="n" data-l="Hours each">${q.hours} h${mark(q.est?.hours)}</td><td data-l="Material">${p.materialName}</td><td class="set" data-l="Settings">${q.settings || "-"}</td></tr>`;
  }));
  const sums = mats.map(([id, list]) => {

    return h`<li>${list[0].materialName}: ${plural(list.length, "part")}, ${g} g of filament, ${hr} h of printer time.${r && r.qty != null ? ` Buy ${r.qty} × ${r.unit}.` : ""}</li>`;

}

// ---------- Build: one step card (also used for the printed list)
function stepCard(i, { print = false } = {}) {
  const s = D.steps[i];
  const parts = group(D.parts.filter((p) => p.step === i), (p) => p.label);
  const fast = group(s.fasteners, (f) => f.material);
  const uses = Object.entries(s.uses ?? {});
  // a prints step: the parts the printer makes here and the printer time (inside the wait), as plan.md "Prints:"
  const printing = group(D.parts.filter((p) => p.print && p.print.step === i), (p) => p.label);
  const time = (s.minutes > 0 || s.wait > 0) && `${s.minutes > 0 ? dur(work(s.minutes)) : ""}${s.wait > 0 ? `${s.minutes > 0 ? " + " : ""}${dur(s.wait)} wait` : ""}`;
  const tools = (s.tools ?? []).map((id) => TOOL.get(id) ?? { name: id });
  const cards = (s.teach ?? []).filter((id) => D.techniques && Object.hasOwn(D.techniques, id)).map((id) => {
    const c = D.techniques[id], first = FIRST.get(id) === i, open = first && (print || S.level === "new");
    return h`<details class="tech"${open ? h` open` : ""}><summary>${c.name}${!first && h`<span class="see">see step ${FIRST.get(id) + 1}</span>`}</summary><div class="in">
      <ol>${c.do.map((d) => h`<li>${d}</li>`)}</ol>${c.tools?.length > 0 && h`<p class="tl">Tools: ${c.tools.join(", ")}</p>`}${c.why && h`<p class="why"><b>Why</b>${c.why}</p>`}</div></details>`;
  });
  return h`
    <div class="eyebrow">Step ${i + 1} of ${N} · ${s.phase || "Build"}</div>
    ${print ? h`<h2>${i + 1}. ${s.title}</h2>` : h`<h2 id="jig-step-title" tabindex="-1">${s.title}</h2>`}
    <div class="meta">${time && h`<span class="pill">${time}</span>`}
      ${printing.length > 0 && h`<span class="pill">Print: ${printing.map(([label, list]) => `${list.length} × ${label} ${list[0].name}`).join(", ")} · ${dur(s.printMinutes)} printer time</span>`}
      ${parts.map(([label, list]) => h`<span class="pill part"><b>${label}</b> ${list.length > 1 ? `${list.length} × ` : ""}${list[0].name}</span>`)}
      ${fast.map(([id, list]) => h`<span class="pill">${list.reduce((a, f) => a + (f.count ?? 1), 0)} × ${mat(id).name}${mat(id).spec ? `, ${mat(id).spec}` : ""}</span>`)}
      ${uses.map(([id, q]) => h`<span class="pill">${mat(id).unit && !byPiece(mat(id)) ? plural(amount(q), mat(id).unit) : `${amount(q)} ×`} ${mat(id).name}${mat(id).spec ? `, ${mat(id).spec}` : ""}</span>`)}
      ${s.finish && h`<span class="pill">Finish: ${mat(s.finish.material).name}${s.finish.coats > 0 ? `, ${plural(s.finish.coats, "coat")}` : ""}</span>`}</div>
    ${tools.length > 0 && h`<div class="meta">${tools.map((t) => h`<span class="pill${t.ppe ? " ppe" : ""}">${t.name}</span>`)}</div>`}
    ${warningsOf(s).map(warnBox)}
    ${(s.do ?? []).length > 0 && h`<ol class="do">${s.do.map((d) => (typeof d === "string" ? h`<li>${d}</li>` : h`<li${d.new ? h` class="new only-new"` : ""}>${d.new && h`<span class="sr-only">First time: </span>`}${d.t}</li>`))}</ol>`}
    ${cards}
    ${s.check && h`<label class="check"><input type="checkbox"${print ? "" : h` data-done="${s.id}"`}${!print && S.done[s.id] ? h` checked` : ""}><span><b>Check.</b> ${s.check}</span></label>`}
    ${s.why && h`<p class="why only-new"><b>Why</b>${s.why}</p>`}

function buildShell() {

  <section class="print-only" data-print></section>`;
}
const readout = (i) => {
  const s = D.steps[i], k = D.parts.filter((p) => p.step === i).length, n = fastCount(s), coat = s.finish?.parts?.length ?? 0;
  if (s.pose === "kit") return "parts on the floor";
  if (!k && !n && coat) return `finish on ${plural(coat, "part")}`;
  // a step that only shows props (the wall, the ground): name them, not "0 parts · 0 fasteners". A label that comes
  // more than once shows its count ("2 × Front leg"), and after 3 labels the line gives only the count of the rest.
  if (!k && !n) {
    const c = new Map();
    for (const id of s.props ?? []) { const l = (D.props && Object.hasOwn(D.props, id) && D.props[id].label) || id; c.set(l, (c.get(l) ?? 0) + 1); }
    const names = [...c].map(([l, m]) => (m > 1 ? `${m} × ${l}` : l));
    const list = names.length > 3 ? `${names.slice(0, 2).join(", ")} and ${names.length - 2} more` : names.join(", ");
    return list ? `no new parts · ${list}` : "no new parts";
  }
  return `${plural(k, "part")} · ${plural(n, "fastener")}`;
};
const KEYS = "Use the arrow keys to turn it. Use + and - to zoom.";
// step view.note: a note on the 3D view only ("The picture shows the cube upright."), at every level. It is under the
// view and in the canvas label, never in the step card, so print, the no-script copy and plan.md do not show it. The

const viewNote = (i) => (typeof D.steps[i].view?.note === "string" ? D.steps[i].view.note.trim() : "");
const stepLabel = (i) => `3D view of step ${i + 1} of ${N}: ${D.steps[i].title}. ${D.steps[i].pose === "kit" ? "The cut parts lie on the floor." : `${readout(i).replace(" · ", ", ").replace(/^./, (c) => c.toUpperCase())}.`} ${viewNote(i) ? `${viewNote(i)} ` : ""}${KEYS}`;

const SHELL = { plan: planShell, shop: () => h`<div data-fill="shop"></div>`, cut: () => h`<div data-fill="cut"></div>`, build: buildShell };

root.innerHTML = String(h`

${TABS.map((t) => h`<section id="jig-panel-${t}" data-panel="${t}" ${single ? h`aria-label="${NAMES[t]}"` : h`role="tabpanel" aria-labelledby="jig-tab-${t}" tabindex="0"`} hidden>${SHELL[t]()}</section>`)}

let current = null, heroView = null, stepsView = null, fitWidth = 0, boqWidth = 0;

const setHash = () => { try { history.replaceState(null, "", current === "build" && N ? `#build/${S.step + 1}` : `#${current}`); } catch {} };
function markRail() {

// Keep the current chip inside the rail (it scrolls sideways on narrow screens).
function railScroll() {
  const rail = $(".rail"), chip = $(`.rail [data-go="${S.step}"]`);

}
function showStep(i, fly = true) {

// The Parts table fits its card. Cut sizes stay on one line and the material has its own column until the table would
// scroll sideways. Then, one stage at a time while it still would (data-fit): the material goes under the name
// ("stack"), the sizes wrap after a "×" ("wrap"), the Parts card takes the full width of the tab ("wide"), a long
// material name breaks inside a word ("mat"), and last a long part name breaks too ("break"). So a wide font (the
// page text is the system font) never breaks a short name while there is room to give. It fits again only when the
// width of the tab changes, so its own change of size cannot loop.
function fitParts(force = false) {
  const t = $("table.parts"), s = t?.parentElement, w = t?.closest(".grid2")?.clientWidth ?? 0;
  if (!t || (w === fitWidth && !force)) return;
  fitWidth = w;
  if (!w) return; // a hidden tab: fit when it shows
  const over = () => s.scrollWidth > s.clientWidth + 1;
  t.removeAttribute("data-fit");
  for (const f of ["stack", "stack wrap", "wide", "wide stack", "wide stack wrap", "wide stack wrap mat", "wide stack wrap mat break"]) { if (!over()) break; t.dataset.fit = f; }
}
// The BOQ fits its card, one stage at a time while the table would scroll sideways. First a word of 20 letters or
// more (data-long) breaks inside the word (data-break), in one item cell at a time, the cell with the widest word
// first; so "Sandpaper" stays whole next to a 40-letter material name. Then the Buy and Rate cells wrap at a space
// (data-fit "wrap"), and last each row stacks as on a phone ("wrap stack"). A short word never breaks, whatever the
// width of the system font. Under 601 px each row is a grid and page.css breaks a word only when it is longer than
// the line. Same width memo rule.
function fitBoq(force = false) {
  const t = $("[data-panel=shop] table.boq"), s = t?.closest(".scroll"), w = s?.clientWidth ?? 0;
  if (!t || (w === boqWidth && !force)) return;
  boqWidth = w;
  if (!w) return;
  const over = () => s.scrollWidth > s.clientWidth + 1, cells = $$("tbody td:nth-child(2)", t);
  t.removeAttribute("data-fit");
  cells.forEach((td) => td.removeAttribute("data-break"));
  if (!over()) return;
  const rg = document.createRange(), widest = (td) => {
    let m = 0;
    for (let tw = document.createTreeWalker(td, NodeFilter.SHOW_TEXT), n = tw.nextNode(); n; n = tw.nextNode()) for (const x of n.data.matchAll(/\S+/g)) {
      rg.setStart(n, x.index);
      rg.setEnd(n, x.index + x[0].length);
      m = Math.max(m, rg.getBoundingClientRect().width);
    }
    return m;
  };
  for (const [td] of cells.filter((td) => td.hasAttribute("data-long")).map((td) => [td, widest(td)]).sort((a, b) => b[1] - a[1])) { td.dataset.break = ""; if (!over()) return; }
  for (const f of ["wrap", "wrap stack"]) { t.dataset.fit = f; if (!over()) return; }
}
function tab(name, { focus = false, hash = true } = {}) {
  current = name;
  S.tab = name;
  save();
  $$("[data-tab]").forEach((b) => { const on = b.dataset.tab === name; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
  $$("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== name));
  if (name === "cut") fitParts();
  if (name === "shop") fitBoq();
  if (name === "build") railScroll();
  if (focus) $(`[data-tab="${name}"]`)?.focus();
  if (hash) setHash();
}
const live = $("[data-live]");
const announce = (msg) => { live.textContent = ""; setTimeout(() => (live.textContent = msg), 60); };
// After a step change: announce it, focus the step heading, and bring the view (narrow screens) or the heading into sight.
function go(i, { force = false } = {}) {
  if (!TABS.includes("build") || !N) return;
  const k = clamp(i), away = current !== "build";
  if (k === S.step && !away && !force) return;
  if (away) tab("build", { hash: false });
  const s = showStep(k, true);
  announce(`Step ${k + 1} of ${N}: ${s.title}`);
  const hd = $("#jig-step-title");
  if (!hd) return;
  hd.focus({ preventScroll: true });
  // scroll when the target is above the screen, under the sticky tab bar, or low on the screen
  const target = matchMedia("(max-width: 860px)").matches ? $(".build .stage") : hd, r = target.getBoundingClientRect();
  if (away || r.top < ($(".tabs")?.getBoundingClientRect().bottom ?? 0) || r.top > innerHeight * 0.7) target.scrollIntoView({ block: "start", behavior: REDUCED.matches ? "auto" : "smooth" });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest?.("button");
  if (!t || !root.contains(t)) return;
  const d = t.dataset;
  if (d.level) { S.level = d.level; save(); renderLevel(); }
  else if (d.tab) tab(d.tab);
  else if (d.tabGo) tab(d.tabGo, { focus: true });
  else if (d.go !== undefined) go(Number(d.go), { force: current !== "build" });
  else if (t.matches("[data-prev]")) go(S.step - 1);
  else if (t.matches("[data-next]")) {
    // Next marks a step done only when it has no Check box: the reader ticks the check, so the box and the rail agree
    const cur = D.steps[S.step];
    if (!cur.check) S.done[cur.id] = true;
    save();
    markRail();
    if (S.step < N - 1) go(S.step + 1);
    else announce("You finished the last step.");
  } else if (d.v === "spin") heroView?.spin(!heroView.spinning);
  else if (d.v === "replay") stepsView?.replay();
  else if (d.v === "reset") stepsView?.reset();
  else if ((d.v === "explode" || d.v === "ghost") && t.getAttribute("aria-disabled") !== "true") { const on = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", String(on)); stepsView?.[d.v](on); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset?.buy) { S.bought[t.dataset.buy] = t.checked; save(); }
  if (t.dataset?.done) { S.done[t.dataset.done] = t.checked; save(); markRail(); }
});
// Tabs: arrow keys, Home and End move between tabs (automatic activation, roving tabindex).
$(".tabs")?.addEventListener("keydown", (e) => {
  const k = TABS.indexOf(current), n = TABS.length;
  const to = { ArrowRight: (k + 1) % n, ArrowLeft: (k - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  tab(TABS[to], { focus: true });
});
// Left and right arrows change the step only when focus is in the step card or the step viewer (the focused canvas
// takes the arrows for orbit).
document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  const t = e.target;
  if (current !== "build" || !t.closest?.("article.step, [data-viewer='steps']") || t.closest("input, textarea, select, canvas")) return;
  e.preventDefault();
  go(S.step + (e.key === "ArrowRight" ? 1 : -1));
});
// A typed or linked hash goes through go(), as a click does (announce, focus, scroll); then the URL shows the real step.
// A hash the page does not have (no such tab) changes nothing, and the URL goes back to what the page shows, as on load.
addEventListener("hashchange", () => {
  const r = route();
  if (!r.tab) { setHash(); return; }
  if (r.tab === "build" && r.step !== null && N) go(r.step);
  else if (r.tab !== current) tab(r.tab, { hash: false });
  setHash();
});

// ---------- start: text first, then the 3D
const start = route();
if (start.step !== null) S.step = start.step;
S.step = clamp(S.step);
fill("shop", shopText());
fill("cut", cutText());
renderLevel();
tab(start.tab ?? S.tab, { hash: Boolean(location.hash) });
// fit the Parts table and the BOQ again after a resize (in the next frame, so the observer never sees its own change)
// and when the web fonts arrive
const fitBoxes = [$("table.parts")?.parentElement, $("[data-panel=shop] table.boq")?.closest(".scroll")].filter(Boolean);
if (fitBoxes.length && typeof ResizeObserver === "function") { const ro = new ResizeObserver(() => requestAnimationFrame(() => { fitParts(); fitBoq(); })); fitBoxes.forEach((b) => ro.observe(b)); }
document.fonts?.ready.then(() => { fitParts(true); fitBoq(true); });
const onSpin = (on) => { const b = $('[data-v="spin"]'); if (b) { b.textContent = on ? "Pause" : "Play"; b.setAttribute("aria-label", on ? "Pause the turn" : "Play the turn"); } };
const heroHost = $('[data-viewer="hero"]'), stepsHost = $('[data-viewer="steps"]');
if (heroHost) createViewer(heroHost, D, { mode: "hero", onSpin, label: `3D model of the ${D.meta.title}, finished. ${KEYS}` }).then((v) => { heroView = v; });
if (stepsHost) createViewer(stepsHost, D, { mode: "steps", label: stepLabel(S.step) }).then((v) => { stepsView = v; v?.go(S.step, false); });
</script>
</body>
</html>
